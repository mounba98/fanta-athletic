<!DOCTYPE html>
<html lang="it">
<head>
  <script src="resources/theme-preload.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classifica Scontri Diretti</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="resources/sheet.css?v=202510172227" />
  <style>
    .container { max-width: 1000px; margin: 0 auto; padding: 16px; }
    .table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    .table th, .table td { border-bottom: 1px solid rgba(0,0,0,0.08); padding: 10px; text-align: left; }
    .table th { background: var(--primary); color: white; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <a class="logo-home" href="index.html" aria-label="Home">
      <img src="resources/logo.png" alt="Fanta Athletic" />
    </a>
    <h1>Classifica Scontri Diretti</h1>
  </header>

  <main class="container">
    <section>
      <h2>Classifica H2H (18 Squadre)</h2>
      <p>Sistema 3-1-0. Criteri: Punti, Scontri diretti, Differenza punti, Punti totali.</p>
      <table class="table" id="h2hTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Squadra</th>
            <th>G</th>
            <th>V</th>
            <th>N</th>
            <th>P</th>
            <th>Pt Fatti</th>
            <th>Pt Subiti</th>
            <th>Diff</th>
            <th>Punti</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js?v=20251021-2"></script>
  <script>
    // Init Firebase SUBITO
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
  </script>
  <script>
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
    const db = firebase.firestore();
  </script>
  <script src="resources/app-init.js"></script>
  <script>
    const SEASON = '2024-25';

    async function boot(){
      // Load team names
      const teamsSnap = await db.collection('teams').orderBy(firebase.firestore.FieldPath.documentId()).get();
      const teamNames = teamsSnap.docs.map((d,i)=> d.data().name || `Squadra ${i+1}`);

      // Load all h2h results
      const resultsSnap = await db.collection('h2h_results').doc(SEASON).collection('giornate').get();
      const stats = Array.from({length:18}, (_,i)=>({ idx:i, name:teamNames[i], g:0, v:0, n:0, p:0, pf:0, ps:0, pts:0 }));

      resultsSnap.docs.forEach(doc=>{
        const data = doc.data();
        if (!data.matches) return;
        data.matches.forEach(m=>{
          if (m.home==null || m.away==null || m.scoreHome==null || m.scoreAway==null) return;
          stats[m.home].g++; stats[m.away].g++;
          stats[m.home].pf += m.scoreHome; stats[m.home].ps += m.scoreAway;
          stats[m.away].pf += m.scoreAway; stats[m.away].ps += m.scoreHome;
          
          // Track forfeit penalties
          if (m.forfeitHome) {
            stats[m.home].forfeit = (stats[m.home].forfeit || 0) + 1;
          }
          if (m.forfeitAway) {
            stats[m.away].forfeit = (stats[m.away].forfeit || 0) + 1;
          }
          
          if (m.scoreHome > m.scoreAway){ stats[m.home].v++; stats[m.away].p++; stats[m.home].pts+=3; }
          else if (m.scoreHome < m.scoreAway){ stats[m.away].v++; stats[m.home].p++; stats[m.away].pts+=3; }
          else { stats[m.home].n++; stats[m.away].n++; stats[m.home].pts++; stats[m.away].pts++; }
        });
      });

      // Sort: pts desc, h2h (TODO), diff desc, pf desc
      stats.sort((a,b)=> (b.pts-a.pts) || ((b.pf-b.ps)-(a.pf-a.ps)) || (b.pf-a.pf));

      const tb = document.querySelector('#h2hTable tbody');
      tb.innerHTML = stats.map((s,i)=>{
        let bg='', color='#000';
        if (i===0){ bg='#ffd700'; color='#000'; }
        else if (i===1){ bg='#c0c0c0'; color='#000'; }
        else if (i===2){ bg='#cd7f32'; color='#000'; }
        else { color='#fff'; }
        const forfeitIndicator = s.forfeit ? ` ⚠️(${s.forfeit})` : '';
        return `<tr style="background:${bg};color:${color};">
          <td>${i+1}</td>
          <td style="font-weight:${i<3?'800':'600'};">${s.name}${forfeitIndicator}</td>
          <td>${s.g}</td>
          <td>${s.v}</td>
          <td>${s.n}</td>
          <td>${s.p}</td>
          <td>${s.pf.toFixed(2)}</td>
          <td>${s.ps.toFixed(2)}</td>
          <td>${(s.pf-s.ps).toFixed(2)}</td>
          <td style="font-weight:${i<3?'900':'700'};">${s.pts}</td>
        </tr>`;
      }).join('');
    }

    firebase.auth().onAuthStateChanged(user=>{ if (user) boot(); else location.href='auth.html'; });
  </script>
  <script src="resources/mobile-detect.js?v=2025101801"></script>
  <script src="resources/bottom-nav.js?v=2025101802"></script>
  <script src="resources/theme.js?v=202510172227"></script>
  <script src="resources/navbar.js?v=202510172227"></script>
  <script src="resources/navbar-profile-icon.js?v=2025102001"></script>
  <script src="resources/notifications-dropdown.js?v=2025102002"></script>
</body>
</html>
