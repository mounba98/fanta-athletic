<html lang="it">
<head>
  <script src="resources/theme-preload.js?v=20260925"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classifica Scontri Diretti</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="resources/sheet.css?v=20260921-header" />
  <link rel="stylesheet" href="resources/tablet-support.css?v=20260920-final" />
  <link rel="stylesheet" href="resources/tablet-landscape.css?v=20260920-final" />
  <script src="resources/mobile-detect.js?v=20260920-final"></script>
  <style>
    .container { max-width: 1000px; margin: 0 auto; padding: 16px; }
    .table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    .table th, .table td { border-bottom: 1px solid rgba(0,0,0,0.08); padding: 10px; text-align: left; }
    .table th { background: var(--primary); color: white; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <a class="logo-home" href="index.html" aria-label="Home">
      <img src="resources/logo.png" alt="Fanta Athletic" />
    </a>
    <h1>Classifica Scontri Diretti</h1>
  </header>

  <main class="container">
    <section>
      <h2>Classifica scontri diretti</h2>
      <p id="h2hRules">Criteri: punti in classifica, differenza reti, reti fatte.</p>
      <table class="table" id="h2hTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Squadra</th>
            <th>G</th>
            <th>V</th>
            <th>N</th>
            <th>P</th>
            <th>Pt Fatti</th>
            <th>Pt Subiti</th>
            <th>Diff</th>
            <th>Punti</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="resources/firebase-app-compat.js"></script>
  <script src="resources/firebase-auth-compat.js"></script>
  <script src="resources/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js?v=20260920-final"></script>
  <script src="resources/season.js?v=20260925e"></script>
  <script src="resources/h2h.js?v=20260925e"></script>
  <script>
    // Init Firebase SUBITO
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
  </script>
  <script>
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
    const db = firebase.firestore();
  </script>
  <script src="resources/app-init.js?v=20260925c"></script>
  <script>
    let SEASON = '2024-25'; // cartella scontri diretti: dal 25/09/2026 la decide la Stagione (D087)
    async function seasonKey() {
      if (window.Season) { try { SEASON = (await window.Season.load()).h2h.key || SEASON; } catch (e) {} }
      return SEASON;
    }

    async function boot(){
      // Numeri delle squadre = id del documento, come nel Calcolo giornata e nel calendario (D100)
      const teamsSnap = await db.collection('teams').get();
      const names = {};
      teamsSnap.docs.forEach(d => { names[d.id] = (d.data() || {}).name || ('Squadra ' + d.id); });

      const season = window.Season ? await window.Season.load() : null;
      const cfg = (season && season.h2h) || { vittoria: 3, pareggio: 1, sconfitta: 0 };
      const tb = document.querySelector('#h2hTable tbody');
      document.getElementById('h2hRules').textContent =
        `Vittoria ${cfg.vittoria} · pareggio ${cfg.pareggio} · sconfitta ${cfg.sconfitta}. Criteri: punti in classifica, differenza reti, reti fatte.`;
      if (season && !window.H2H.active(season)) {
        tb.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:24px;">Quest\'anno si gioca in modalità classica: niente scontri diretti.</td></tr>';
        return;
      }

      const resultsSnap = await db.collection('h2h_results').doc(await seasonKey()).collection('giornate').get();
      const rows = window.H2H.standings(resultsSnap.docs.map(d => d.data() || {}), cfg);
      if (!rows.length) {
        tb.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:24px;">Nessuno scontro diretto ancora giocato.</td></tr>';
        return;
      }

      tb.innerHTML = rows.map((s,i)=>{
        let bg='', color='#000';
        if (i===0){ bg='#facc15'; color='#000'; }
        else if (i===1){ bg='#c0c0c0'; color='#000'; }
        else if (i===2){ bg='#cd7f32'; color='#000'; }
        else { color='#fff'; }
        const name = names[String(s.team)] || ('Squadra ' + s.team);
        const forfeitIndicator = s.tavolino ? ` ⚠️(${s.tavolino})` : '';
        return `<tr style="background:${bg};color:${color};">
          <td>${i+1}</td>
          <td style="font-weight:${i<3?'800':'600'};">${name}${forfeitIndicator}</td>
          <td>${s.g}</td>
          <td>${s.v}</td>
          <td>${s.n}</td>
          <td>${s.p}</td>
          <td>${Number(s.gf).toFixed(2)}</td>
          <td>${Number(s.gs).toFixed(2)}</td>
          <td>${(s.gf-s.gs).toFixed(2)}</td>
          <td style="font-weight:${i<3?'900':'700'};">${s.pts}</td>
        </tr>`;
      }).join('');
    }

    firebase.auth().onAuthStateChanged(user=>{ if (user) boot(); else location.href='auth.html'; });
  </script>
  <script src="resources/bottom-nav.js?v=20260920-final"></script>
  <script src="resources/theme.js?v=20260920-final"></script>
  <script src="resources/navbar.js?v=20260925"></script>
  <script src="resources/navbar-profile-icon.js?v=20260921-header"></script>
  <script src="resources/notifications-dropdown.js?v=20260920-final"></script>
</body>
</html>
