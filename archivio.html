<!DOCTYPE html>
<html lang="it">
<head>
  <script src="resources/theme-preload.js?v=20260925b"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Archivio stagioni - Fanta Athletic</title>
  <link rel="stylesheet" href="resources/sheet.css?v=20260921-header" />
  <link rel="stylesheet" href="resources/tablet-support.css?v=20260920-final" />
  <link rel="stylesheet" href="resources/tablet-landscape.css?v=20260920-final" />
  <script src="resources/mobile-detect.js?v=20260920-final"></script>
  <style>
    body { padding-bottom: 90px; }
    .container { max-width: 900px; margin: 0 auto; padding: 16px; }
    .seasons { display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; scrollbar-width:none; }
    .seasons button { flex:0 0 auto; padding:9px 16px; border-radius:999px; border:1px solid rgba(148,163,184,.35) !important; background:var(--card) !important; color:var(--text) !important; font-weight:700; font-family:inherit; cursor:pointer; }
    .seasons button.on { background:#0c0f6d !important; border-color:#0c0f6d !important; color:#fff !important; }
    .hero { padding:18px; border-radius:18px; background:linear-gradient(135deg,#920100,#0c0f6d); color:#fff; box-shadow:var(--shadow); margin-bottom:14px; }
    .hero .k { font-size:12px; text-transform:uppercase; letter-spacing:.06em; opacity:.85; }
    .hero .champ { font-size:24px; font-weight:800; margin-top:4px; }
    .hero .sub { opacity:.9; font-size:13px; margin-top:4px; }
    .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
    .card h2 { font-size:18px; margin:0 0 10px; }
    .rank { width:100%; border-collapse:collapse; font-size:14px; }
    .rank td { padding:9px 6px; border-top:1px solid rgba(148,163,184,.18); }
    .rank td.pos { width:34px; font-weight:800; text-align:center; }
    .rank td.pts { text-align:right; font-weight:800; }
    .rank tr.p1 td.pos { color:#facc15; } .rank tr.p2 td.pos { color:#cbd5e1; } .rank tr.p3 td.pos { color:#d97706; }
    .muted { color:var(--muted); font-size:13px; }
    .scroll { overflow-x:auto; }
    .days { border-collapse:collapse; font-size:13px; white-space:nowrap; }
    .days th, .days td { padding:6px 8px; border-top:1px solid rgba(148,163,184,.18); text-align:right; }
    .days th:first-child, .days td:first-child { text-align:left; position:sticky; left:0; background:var(--card); }
    .fz { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .fz div { padding:12px; border-radius:14px; color:#fff; text-align:center; font-weight:800; font-size:22px; }
    .fz small { display:block; font-size:12px; font-weight:600; opacity:.9; }
    .empty { text-align:center; padding:40px 16px; color:var(--muted); }
  </style>
  <!-- Icone app (D105): logo Athletic 2018 su fondo #0c1318 -->
  <link rel="icon" type="image/png" sizes="32x32" href="/resources/app-icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/resources/app-icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="/resources/app-icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <header>
    <a class="logo-home" href="index.html" aria-label="Home"><img src="resources/logo.png" alt="Fanta Athletic" /></a>
    <h1>Archivio stagioni</h1>
  </header>

  <main class="container">
    <div class="seasons" id="seasons"></div>
    <div id="view"><p class="empty">Caricamento…</p></div>
  </main>

  <script src="resources/firebase-app-compat.js"></script>
  <script src="resources/firebase-auth-compat.js"></script>
  <script src="resources/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js?v=20260920-final"></script>
  <script src="resources/season.js?v=20260925e"></script>
  <script src="resources/season-archive.js?v=20260925b"></script>
  <script>
    const $ = id => document.getElementById(id);
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmt(n) { return String(Math.round(n * 2) / 2).replace('.', ','); }
    let lid = null, list = [];

    function gNum(g) { return parseInt(String(g).replace(/\D/g, ''), 10) || 0; }

    async function show(a) {
      document.querySelectorAll('#seasons button').forEach(b => b.classList.toggle('on', b.dataset.id === a.id));
      const st = a.standings || [];
      const champ = st[0];
      let html = '<div class="hero"><div class="k">Stagione ' + esc(a.label || a.id) + ' • Campione</div>' +
        '<div class="champ">🏆 ' + esc(champ ? champ.name : '—') + '</div>' +
        '<div class="sub">' + (champ ? fmt(champ.total) + ' punti' : '') + (st[1] ? ' • 2° ' + esc(st[1].name) : '') + (st[2] ? ' • 3° ' + esc(st[2].name) : '') + '</div></div>';

      html += '<section class="card"><h2>Classifica finale</h2><table class="rank">' +
        st.map((t, i) => '<tr class="p' + (i + 1) + '"><td class="pos">' + (i + 1) + '</td><td>' + esc(t.name) + '</td><td class="muted">' + t.days + ' g.</td><td class="pts">' + fmt(t.total) + '</td></tr>').join('') +
        '</table></section>';

      const gs = [...new Set(st.flatMap(t => Object.keys(t.byDay || {})))].sort((x, y) => gNum(x) - gNum(y));
      if (gs.length) {
        html += '<section class="card"><h2>Punti giornata per giornata</h2><div class="scroll"><table class="days"><tr><th>Squadra</th>' +
          gs.map(g => '<th>' + esc(g) + '</th>').join('') + '</tr>' +
          st.map(t => '<tr><td>' + esc(t.name) + '</td>' + gs.map(g => '<td>' + (t.byDay[g] != null ? fmt(t.byDay[g]) : '–') + '</td>').join('') + '</tr>').join('') +
          '</table></div></section>';
      }
      html += '<div id="extra"></div>';
      $('view').innerHTML = html;

      // Mini-gioco e partite Athletic (letti dall'archivio)
      try {
        const [cs, cal] = await Promise.all([SeasonArchive.items(lid, a.id, 'contest_standings'), SeasonArchive.items(lid, a.id, 'athletic_calendar')]);
        let ex = '';
        const cur = cs.find(x => /current$/.test(x.path));
        if (cur && cur.data && cur.data.users) {
          const t = { curva: 0, piana: 0 };
          Object.values(cur.data.users).forEach(u => { if (t[u.faction] != null) t[u.faction] += Number(u.points || 0); });
          ex += '<section class="card"><h2>Curva Morello vs Piana</h2><div class="fz"><div style="background:#920100">' + t.curva + '<small>Curva Morello</small></div><div style="background:#0c0f6d">' + t.piana + '<small>Piana</small></div></div></section>';
        }
        if (cal.length) {
          const rows = cal.map(x => x.data).sort((x, y) => (x.giornata || 0) - (y.giornata || 0));
          ex += '<section class="card"><h2>Partite Athletic</h2><table class="rank">' + rows.map(m =>
            '<tr><td class="muted">G' + esc(m.giornata) + '</td><td>' + esc(m.homeTeam) + ' – ' + esc(m.awayTeam) + '</td><td class="pts">' +
            (m.homeScore != null && m.awayScore != null ? esc(m.homeScore) + '-' + esc(m.awayScore) : '–') + '</td></tr>').join('') + '</table></section>';
        }
        $('extra').innerHTML = ex;
      } catch (e) { console.warn('[archivio] dettagli', e && (e.code || e.message)); }
    }

    async function init() {
      let r = 0; while ((!window.auth || !window.db) && r++ < 50) await new Promise(x => setTimeout(x, 100));
      window.auth.onAuthStateChanged(async (user) => {
        if (!user) { location.href = 'auth.html?redirect=' + encodeURIComponent(location.href); return; }
        try {
          lid = await Season.leagueId();
          list = (await SeasonArchive.list(lid)).filter(a => a.stato === 'verificato' || a.stato === 'copiato')
            .sort((a, b) => String(b.id).localeCompare(String(a.id)));
        } catch (e) {
          console.warn('[archivio]', e && (e.code || e.message));
          $('view').innerHTML = '<p class="empty">Archivio non disponibile al momento.</p>'; return;
        }
        if (!list.length) { $('view').innerHTML = '<p class="empty">Nessuna stagione archiviata ancora.<br>La prima sarà la 2025/26.</p>'; return; }
        $('seasons').innerHTML = list.map(a => '<button data-id="' + esc(a.id) + '">' + esc(a.label || a.id) + '</button>').join('');
        document.querySelectorAll('#seasons button').forEach(b => b.onclick = () => show(list.find(a => a.id === b.dataset.id)));
        show(list[0]);
      });
    }
    init();
  </script>
  <script src="resources/navbar.js?v=20260925"></script>
  <script src="resources/mobile-menu.js?v=20260925c"></script>
  <script src="resources/edge-swipe-menu.js?v=20260923-final"></script>
  <script src="resources/bottom-nav.js?v=20260920-final"></script>
  <script src="resources/theme.js?v=20260925b"></script>
</body>
</html>
