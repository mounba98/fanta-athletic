<!DOCTYPE html>
<html lang="it">
<head>
  <script src="resources/theme-preload.js?v=20260925b"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giornata - Fanta Athletic</title>
  <link rel="stylesheet" href="resources/sheet.css?v=20261024" />
  <link rel="stylesheet" href="resources/tablet-support.css?v=20260920-final" />
  <link rel="stylesheet" href="resources/tablet-landscape.css?v=20260920-final" />
  <script src="resources/mobile-detect.js?v=20260920-final"></script>
  <style>
    body { padding-bottom: 90px; }
    .container { max-width: 900px; margin: 0 auto; padding: 16px; }
    .days { display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; scrollbar-width:none; }
    .days button { flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1px solid rgba(148,163,184,.35) !important; background:var(--card) !important; color:var(--text) !important; font-weight:700; font-family:inherit; cursor:pointer; }
    .days button.on { background:#0c0f6d !important; border-color:#0c0f6d !important; color:#fff !important; }
    .hero { padding:18px; border-radius:18px; background:linear-gradient(135deg,#920100,#0c0f6d); color:#fff; box-shadow:var(--shadow); margin-bottom:14px; }
    .hero .k { font-size:12px; text-transform:uppercase; letter-spacing:.06em; opacity:.85; display:flex; justify-content:space-between; gap:8px; }
    .hero .vs { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; margin-top:10px; }
    .hero .vs .t { font-weight:800; font-size:16px; line-height:1.25; }
    .hero .vs .t:last-child { text-align:right; }
    .hero .sc { font-size:26px; font-weight:900; white-space:nowrap; }
    .hero .sc small { font-size:14px; opacity:.8; font-weight:700; }
    .hero .sub { opacity:.9; font-size:13px; margin-top:8px; text-align:center; }
    .pill { font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; background:rgba(255,255,255,.18); text-transform:none; letter-spacing:0; }
    .cols { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; margin-bottom:14px; }
    .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; min-width:0; }
    .cols .card { padding: 12px; }
    @media (max-width: 420px) { .cols .card { padding: 10px 8px; } .pl { font-size:13px; gap:5px; } .pl .r { width:20px; height:20px; } }
    .card h2 { font-size:18px; margin:0 0 10px; line-height:1.25; }
    .cols .card h2 { font-size:15px; margin-bottom:8px; }
    .pl { display:flex; align-items:center; gap:6px; padding:7px 0; border-top:1px solid rgba(148,163,184,.18); font-size:14px; }
    .pl:first-of-type { border-top:0; }
    .pl .r { flex:0 0 auto; font-size:10px; font-weight:800; width:22px; height:22px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; background:rgba(148,163,184,.18); color:var(--text); }
    .pl .n { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pl .p { flex:0 0 auto; font-weight:800; }
    .cap { flex:0 0 auto; font-size:10px; font-weight:900; color:#000; background:#facc15; border-radius:999px; padding:1px 5px; }
    .muted { color:var(--muted); font-size:13px; }
    .note { font-size:12px; color:var(--muted); margin-top:8px; line-height:1.35; }
    .hidden-box { text-align:center; padding:18px 6px; color:var(--muted); font-size:13px; line-height:1.4; }
    .list .row { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; padding:10px 4px; border-top:1px solid rgba(148,163,184,.18); cursor:pointer; font-size:14px; }
    .list .row:first-of-type { border-top:0; }
    .list .row.me { font-weight:800; }
    .list .row span:last-child { text-align:right; }
    .list .row b { white-space:nowrap; }
    .empty { text-align:center; padding:40px 16px; color:var(--muted); }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/resources/app-icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/resources/app-icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="/resources/app-icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <header>
    <a class="logo-home" href="index.html" aria-label="Home"><img src="resources/logo.png" alt="Fanta Athletic" /></a>
    <h1>Giornata</h1>
  </header>

  <main class="container">
    <div class="days" id="days"></div>
    <div id="view"><p class="empty">Caricamento…</p></div>
  </main>

  <script src="resources/firebase-app-compat.js"></script>
  <script src="resources/firebase-auth-compat.js"></script>
  <script src="resources/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js?v=20260920-final"></script>
  <script src="resources/season.js?v=20261024b"></script>
  <script src="resources/h2h.js?v=20261024b"></script>
  <script src="resources/lineup-deadline.js?v=20261024"></script>
  <script>
    // Scontri diretti, una sfida per volta (D124): le due formazioni affiancate.
    // La formazione dell'avversario si vede solo a formazioni chiuse (o a giornata
    // calcolata), come nel fantacalcio. Dopo il calcolo: punti di ogni giocatore.
    const $ = id => document.getElementById(id);
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    const fmt = n => String(Math.round(Number(n || 0) * 2) / 2).replace('.', ',');
    const gNum = g => parseInt(String(g).replace(/\D/g, ''), 10) || 0;
    const ROLE = { Portiere: 'P', Difensore: 'D', Centrocampista: 'C', Attaccante: 'A' };
    let L = null, S = null, me = null, teams = {}, players = {}, coaches = {}, sched = [], results = {};
    let cur = { g: null, match: null };

    const raw = () => window.__LEGACY_DB__ || firebase.firestore();

    function label(p) {
      if (!p) return '—';
      const nick = String(p.nickname || '').trim();
      if (nick) return nick.replace(/(^|\s)\S/g, c => c.toUpperCase());
      // come nel fantacalcio: solo il cognome (tutto dopo il nome di battesimo)
      const full = String(p.nome_completo || p.name || p.player_id || '—').trim().split(/\s+/);
      return full.length > 1 ? full.slice(1).join(' ') : full[0];
    }

    async function deadlineOf(g) {
      const n = gNum(g);
      try {
        const d = await L.collection('deadlines').doc('giornata_' + n).get();
        const x = d.exists ? d.data().deadline : null;
        if (x && x.toDate) return x.toDate();
      } catch (e) { /* nessuna scadenza manuale */ }
      const c = await FALineupDeadline.fromCalendar(n);
      return c ? c.deadline : null;
    }

    // Formazione di una squadra: dal risultato calcolato se c'è, altrimenti da quella salvata
    async function lineupOf(teamId, g) {
      const r = results[g] && results[g].teams ? results[g].teams[String(teamId)] : null;
      if (r) return { lineup: r.lineup || [], captain: r.captain || null, coachId: r.coachId || null, points: r.points, byPlayer: Object.fromEntries((r.players || []).map(x => [x.playerId, x.points])), from: r.lineupFrom || null, missing: !!r.missingLineup, malus: r.breakdown && r.breakdown.malusFormazione };
      let s = null;
      try { s = await L.collection('teams').doc(String(teamId)).collection('saved').doc(g).get(); } catch (e) { s = null; }
      const d = s && s.exists ? s.data() : {};
      return { lineup: d.lineup || [], captain: d.captain || null, coachId: Array.isArray(d.coach_ids) && d.coach_ids.length ? d.coach_ids[0] : null, points: null, byPlayer: null, from: null, missing: false };
    }

    function teamCard(teamId, info, visible, openAt) {
      const name = (teams[String(teamId)] || {}).name || ('Squadra ' + teamId);
      let body;
      if (!visible) {
        body = '<div class="hidden-box">🔒 La formazione si vede a formazioni chiuse' + (openAt ? '<br><b>' + esc(openAt.toLocaleString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) + '</b>' : '') + '</div>';
      } else if (info.missing || !info.lineup.some(Boolean)) {
        body = '<div class="hidden-box">' + (info.points != null ? 'Formazione non consegnata' : 'Formazione non ancora consegnata') + '</div>';
      } else {
        const coach = info.coachId ? (coaches[info.coachId] || {}) : null;
        body = info.lineup.filter(Boolean).map(pid => {
          const p = players[pid] || {};
          const pts = info.byPlayer ? info.byPlayer[pid] : null;
          return '<div class="pl"><span class="r">' + esc(ROLE[p.role] || '·') + '</span><span class="n">' + esc(label(p)) + '</span>' + (pid === info.captain ? '<span class="cap">C</span>' : '') +
            (info.byPlayer ? '<span class="p">' + (pts != null ? fmt(pts) : '0') + '</span>' : '') + '</div>';
        }).join('') +
          (coach ? '<div class="pl"><span class="r">All</span><span class="n">' + esc(coach.nome || coach.name || info.coachId) + '</span></div>' : '');
        if (info.from) body += '<div class="note">Non consegnata: gioca con la formazione della ' + gNum(info.from) + 'ª giornata' + (info.malus ? ' (' + fmt(info.malus) + ')' : '') + '.</div>';
      }
      return '<div class="card"><h2>' + esc(name) + (info.points != null && visible ? ' · ' + fmt(info.points) : '') + '</h2>' + body + '</div>';
    }

    async function show(g, match) {
      cur = { g, match };
      document.querySelectorAll('#days button').forEach(b => b.classList.toggle('on', b.dataset.g === g));
      const day = sched.find(d => d.id === g);
      if (!day) { $('view').innerHTML = '<p class="empty">Nessuna sfida per questa giornata.</p>'; return; }
      const list = (day.matches || []);
      const mine = list.find(x => x.home === me || x.away === me);
      const m = match || mine || list[0];
      if (!m) { $('view').innerHTML = '<p class="empty">Nessuna sfida per questa giornata.</p>'; return; }
      const res = ((results[g] && results[g].h2h && results[g].h2h.matches) || []).find(x => x.home === m.home && x.away === m.away) || null;
      const computed = !!(res && res.scoreHome != null);
      const dl = await deadlineOf(g);
      const closed = computed || (dl && new Date() >= dl);
      const [hi, ai] = await Promise.all([lineupOf(m.home, g), lineupOf(m.away, g)]);
      const isMine = m.home === me || m.away === me;
      // la propria formazione si vede sempre; le altre solo a formazioni chiuse
      const vis = id => closed || id === me;
      const name = id => (teams[String(id)] || {}).name || ('Squadra ' + id);
      let pill = '', center = '<span class="sc"><small>vs</small></span>', sub = '';
      if (computed) {
        const e = res.esito;
        pill = e === 'X' ? 'Pareggio' : e === '0' ? 'Nessun punto' : (isMine ? (((e === '1') === (m.home === me)) ? 'Vittoria' : 'Sconfitta') : (e === '1' ? 'Vince ' + name(m.home) : 'Vince ' + name(m.away)));
        center = '<span class="sc">' + fmt(res.scoreHome) + ' <small>–</small> ' + fmt(res.scoreAway) + '</span>';
        const sc = S && S.h2h && S.h2h.conversione === 'diretta' && S.h2h.scartoPareggio ? 'Pareggio se la differenza è al massimo ' + fmt(S.h2h.scartoPareggio) + ' punti.' : '';
        sub = sc;
      } else {
        pill = closed ? 'Formazioni chiuse' : 'Da giocare';
        sub = dl && !closed ? 'Formazioni aperte fino a ' + dl.toLocaleString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      }
      let html = '<div class="hero"><div class="k"><span>' + gNum(g) + 'ª giornata' + (isMine ? ' · la mia sfida' : '') + '</span><span class="pill">' + esc(pill) + '</span></div>' +
        '<div class="vs"><span class="t">' + esc(name(m.home)) + '</span>' + center + '<span class="t">' + esc(name(m.away)) + '</span></div>' +
        (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>';
      html += '<div class="cols">' + teamCard(m.home, hi, vis(m.home), dl) + teamCard(m.away, ai, vis(m.away), dl) + '</div>';
      // tutte le sfide della giornata
      const rs = (results[g] && results[g].h2h && results[g].h2h.matches) || [];
      html += '<div class="card list"><h2>Tutte le sfide della ' + gNum(g) + 'ª giornata</h2>' + list.map((x, i) => {
        const r = rs.find(y => y.home === x.home && y.away === x.away);
        const sc = r && r.scoreHome != null ? '<b>' + fmt(r.scoreHome) + ' – ' + fmt(r.scoreAway) + '</b>' : '<small class="muted">vs</small>';
        return '<div class="row' + (x.home === me || x.away === me ? ' me' : '') + '" data-i="' + i + '"><span>' + esc(name(x.home)) + '</span>' + sc + '<span>' + esc(name(x.away)) + '</span></div>';
      }).join('') + (day.bye != null ? '<div class="note">Riposa: ' + esc(name(day.bye)) + '</div>' : '') + '</div>';
      $('view').innerHTML = html;
      document.querySelectorAll('.list .row').forEach(r => r.onclick = () => { show(g, list[Number(r.dataset.i)]); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    }

    async function init() {
      let r = 0; while ((!window.auth || !window.db) && r++ < 50) await new Promise(x => setTimeout(x, 100));
      window.auth.onAuthStateChanged(async (user) => {
        if (!user) { location.href = 'auth.html?redirect=' + encodeURIComponent(location.href); return; }
        try {
          S = await Season.load();
          const lid = await Season.leagueId();
          L = raw().collection('leagues').doc(lid);
          if (!H2H.active(S)) { $('view').innerHTML = '<p class="empty">Quest\'anno non ci sono scontri diretti.</p>'; return; }
          const key = S.h2h.key;
          const [u, ts, ps, cs, sc, rs] = await Promise.all([
            raw().collection('users').doc(user.uid).get(),
            L.collection('teams').get(), L.collection('players').get(), L.collection('coaches').get().catch(() => null),
            L.collection('h2h_schedule').doc(key).collection('giornate').get(),
            L.collection('h2h_results').doc(key).collection('giornate').get()
          ]);
          const ud = u.exists ? u.data() : {};
          me = typeof ud.team_index === 'number' ? ud.team_index : null;
          ts.docs.forEach(d => { teams[d.id] = d.data(); });
          ps.docs.forEach(d => { players[d.id] = Object.assign({ player_id: d.id }, d.data()); });
          try { const j = await (await fetch('resources/coaches.json')).json(); (j.coaches || []).forEach(c => { coaches[c.coach_id] = c; }); } catch (e) { /* facoltativo */ }
          if (cs) cs.docs.forEach(d => { coaches[d.id] = Object.assign({}, coaches[d.id] || {}, d.data()); });
          sched = sc.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => gNum(a.id) - gNum(b.id));
          rs.docs.forEach(d => { results[d.id] = { h2h: d.data() }; });
          // si vedono le giornate della stagione (D124: 20); quelle di riserva per playoff/playout
          // solo quando compaiono nel Calendario Athletic o sono già calcolate
          const maxG = Number(S.numGiornate) || 0;
          if (maxG > 0) {
            let calG = [];
            try { calG = (await raw().collection('athletic_calendar').get()).docs.map(d => parseInt(d.data().giornata, 10)); } catch (e) { /* facoltativo */ }
            sched = sched.filter(d => gNum(d.id) <= maxG || calG.includes(gNum(d.id)) || results[d.id]);
          }
          // punteggi di squadra (con formazione e punti dei giocatori) delle giornate calcolate
          await Promise.all(Object.keys(results).map(async g => {
            try { const t = await L.collection('results').doc(g).collection('teams').get(); results[g].teams = Object.fromEntries(t.docs.map(d => [d.id, d.data()])); }
            catch (e) { results[g].teams = {}; }
          }));
        } catch (e) {
          console.warn('[sfida]', e && (e.code || e.message));
          $('view').innerHTML = '<p class="empty">Sfide non disponibili al momento.</p>'; return;
        }
        if (!sched.length) { $('view').innerHTML = '<p class="empty">Il calendario delle sfide non è ancora pronto.</p>'; return; }
        $('days').innerHTML = sched.map(d => '<button data-g="' + esc(d.id) + '">G' + gNum(d.id) + '</button>').join('');
        document.querySelectorAll('#days button').forEach(b => b.onclick = () => show(b.dataset.g));
        // giornata d'apertura: ?g=, altrimenti la prima non ancora calcolata
        const want = new URLSearchParams(location.search).get('g');
        const firstOpen = sched.find(d => !(results[d.id] && (results[d.id].h2h.matches || []).length));
        const g = (want && sched.some(d => d.id === want)) ? want : (firstOpen || sched[sched.length - 1]).id;
        await show(g);
        const btn = document.querySelector('#days button.on'); if (btn) btn.scrollIntoView({ inline: 'center', block: 'nearest' });
      });
    }
    init();
  </script>

  <script src="resources/app-fresh.js?v=20261004"></script>

</body>
