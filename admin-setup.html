<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>🔧 Admin Setup - Athletic Brescia</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { color: #2d6cdf; margin-top: 0; }
    .section {
      background: #f9fafb;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      border-left: 4px solid #2d6cdf;
    }
    .btn {
      background: #2d6cdf;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
      font-weight: 600;
    }
    .btn:hover { background: #1e5bbf; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-success { background: #10b981; }
    .btn-success:hover { background: #059669; }
    #log {
      background: #1e293b;
      color: #e2e8f0;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      max-height: 500px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.8;
    }
    .success { color: #10b981; }
    .error { color: #ef4444; }
    .info { color: #60a5fa; }
    .warning { color: #fbbf24; }
    .status-box {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 6px;
      margin: 5px;
      font-weight: 600;
    }
    .status-ok { background: #d1fae5; color: #065f46; }
    .status-error { background: #fee2e2; color: #991b1b; }
    .status-pending { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>
  <div id="navbar-container"></div>
  <div class="container">
    <h1>🔧 Admin Setup - Athletic Brescia</h1>
    <p>Script completo per inizializzare database e contest</p>

    <!-- Status -->
    <div class="section">
      <h3>📊 Status</h3>
      <div id="statusBox">
        <span class="status-box status-pending">⏳ In attesa...</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="section">
      <h3>🎯 Azioni Disponibili</h3>
      
      <h4>📋 Regole</h4>
      <button class="btn" onclick="uploadRules()">📤 Upload Regole (97)</button>
      <button class="btn btn-danger" onclick="deleteAllRules()">🗑️ Reset Regole</button>
      <button class="btn btn-success" onclick="verifyRules()">✅ Verifica Regole</button>
      
      <h4 style="margin-top:20px;">🏆 Contest</h4>
      <button class="btn" onclick="setupContest()">🎮 Setup Contest Completo</button>
      <button class="btn btn-success" onclick="verifyContest()">✅ Verifica Contest</button>
      
      <h4 style="margin-top:20px;">📅 Calendario Athletic</h4>
      <button class="btn" onclick="setupCalendario()">📆 Setup Calendario Ottobre</button>
      <button class="btn btn-success" onclick="verifyCalendario()">✅ Verifica Calendario</button>
      
      <h4 style="margin-top:20px;">🚀 All-in-One</h4>
      <button class="btn btn-success" style="font-size:18px;" onclick="setupAll()">
        ⚡ SETUP TUTTO (Regole + Contest + Calendario)
      </button>
    </div>

    <!-- Log -->
    <div class="section">
      <h3>📝 Log</h3>
      <div id="log"></div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="resources/navbar.js?v=2025101901"></script>
  <script src="resources/firebase-cdn-loader.js?v=20251105"></script>
  <script data-original="firebase-app-compat.js" data-fallback="resources/firebase-app-compat.js" src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" onerror="window.__loadFirebaseFallback(this)"></script>
  <script data-original="firebase-auth-compat.js" data-fallback="resources/firebase-auth-compat.js" src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" onerror="window.__loadFirebaseFallback(this)"></script>
  <script data-original="firebase-firestore-compat.js" data-fallback="resources/firebase-firestore-compat.js" src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" onerror="window.__loadFirebaseFallback(this)"></script>
  <script src="resources/firebase-config.js?v=20251021-2"></script>
  <script src="resources/rules-loader.js?v=2025110301"></script>
  
  <script>
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
    window.db = firebase.firestore();
    window.auth = firebase.auth();
    console.log('✅ Firebase inizializzato');
  </script>

  <script>
    function log(msg, type = 'info') {
      const logEl = document.getElementById('log');
      const line = document.createElement('div');
      line.className = type;
      const time = new Date().toLocaleTimeString();
      line.innerHTML = `<span style="color:#94a3b8;">[${time}]</span> ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    function updateStatus(msg, status = 'pending') {
      const statusBox = document.getElementById('statusBox');
      const className = status === 'ok' ? 'status-ok' : status === 'error' ? 'status-error' : 'status-pending';
      const icon = status === 'ok' ? '✅' : status === 'error' ? '❌' : '⏳';
      statusBox.innerHTML = `<span class="status-box ${className}">${icon} ${msg}</span>`;
    }

    async function waitForFirebase(maxRetries = 100) {
      log('⏳ Attendo inizializzazione Firebase...', 'info');
      let retries = 0;
      
      while (retries < maxRetries) {
        if (window.db && window.auth) {
          log('✅ Firebase pronto!', 'success');
          return true;
        }
        await new Promise(resolve => setTimeout(resolve, 100));
        retries++;
      }
      
      log('❌ Firebase non disponibile dopo 10 secondi!', 'error');
      updateStatus('Firebase Error', 'error');
      return false;
    }

    // ========== REGOLE ==========
    
    async function uploadRules() {
      try {
        log('📡 Caricamento rules.json...', 'info');
        
        if (!await waitForFirebase()) return;
        
        const data = await (window.loadRulesJSON ? window.loadRulesJSON() : Promise.resolve({ rules: [] }));
        const rules = data.rules || [];
        
        log(`✅ Trovate ${rules.length} regole in rules.json`, 'success');
        log('📤 Inizio upload su Firestore...', 'info');
        
        let uploaded = 0;
        let errors = 0;
        
        for (const rule of rules) {
          try {
            await window.db.collection('rules').doc(rule.rule_id).set({
              ...rule,
              attivo: true,
              visible: true,
              updated_at: new Date().toISOString()
            }, { merge: true });
            
            uploaded++;
            log(`✓ ${rule.rule_id}: ${rule.nome_bonus} (${rule.valore})`, 'success');
          } catch (e) {
            errors++;
            log(`✗ ${rule.rule_id}: ${e.message}`, 'error');
          }
        }
        
        log(`\n🎉 UPLOAD COMPLETATO!`, 'success');
        log(`   ✅ Successi: ${uploaded}`, 'success');
        log(`   ❌ Errori: ${errors}`, errors > 0 ? 'error' : 'info');
        
        updateStatus(`Regole: ${uploaded} uploaded`, errors === 0 ? 'ok' : 'error');
        
      } catch (e) {
        log(`❌ Errore upload: ${e.message}`, 'error');
        updateStatus('Upload Error', 'error');
      }
    }

    async function deleteAllRules() {
      if (!confirm('⚠️ SICURO? Elimina TUTTE le regole da Firestore!')) return;
      
      try {
        if (!await waitForFirebase()) return;
        
        log('🗑️ Eliminazione regole...', 'warning');
        
        const snapshot = await window.db.collection('rules').get();
        log(`Trovate ${snapshot.docs.length} regole da eliminare`, 'info');
        
        let deleted = 0;
        for (const doc of snapshot.docs) {
          await doc.ref.delete();
          deleted++;
          log(`✗ Eliminata: ${doc.id}`, 'warning');
        }
        
        log(`\n🗑️ Eliminate ${deleted} regole`, 'success');
        updateStatus('Regole eliminate', 'ok');
        
      } catch (e) {
        log(`❌ Errore: ${e.message}`, 'error');
        updateStatus('Delete Error', 'error');
      }
    }

    async function verifyRules() {
      try {
        if (!await waitForFirebase()) return;
        
        log('🔍 Verifica regole...', 'info');
        
        // Load JSON
        const data = await (window.loadRulesJSON ? window.loadRulesJSON() : Promise.resolve({ rules: [] }));
        const jsonRules = data.rules || [];
        log(`📄 JSON: ${jsonRules.length} regole`, 'info');
        
        // Load Firestore
        const snapshot = await window.db.collection('rules').get();
        const firestoreRules = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        log(`🔥 Firestore: ${firestoreRules.length} regole`, 'info');
        
        // Compare R026
        const jsonR026 = jsonRules.find(r => r.rule_id === 'R026');
        const firestoreR026 = firestoreRules.find(r => r.rule_id === 'R026');
        
        log('\n📋 R026 (Tamburo Trasferta):', 'info');
        log(`   JSON: ${jsonR026?.valore}`, jsonR026?.valore === -0.5 ? 'success' : 'error');
        log(`   Firestore: ${firestoreR026?.valore || 'NON TROVATA'}`, firestoreR026?.valore === -0.5 ? 'success' : 'error');
        
        if (jsonR026?.valore === firestoreR026?.valore) {
          log('✅ R026 SINCRONIZZATA!', 'success');
          updateStatus('Regole OK', 'ok');
        } else {
          log('⚠️ MISMATCH! Upload necessario', 'warning');
          updateStatus('Regole Mismatch', 'error');
        }
        
        // Check squalificato
        const r011 = firestoreRules.find(r => r.rule_id === 'R011');
        const r011c = firestoreRules.find(r => r.rule_id === 'R011C');
        log(`\n📋 Squalificato in curva:`, 'info');
        log(`   R011: ${r011?.valore || 'NON TROVATA'}`, r011 ? 'success' : 'error');
        log(`   R011C: ${r011c?.valore || 'NON TROVATA'}`, r011c ? 'success' : 'error');
        
      } catch (e) {
        log(`❌ Errore: ${e.message}`, 'error');
        updateStatus('Verify Error', 'error');
      }
    }

    // ========== CONTEST ==========
    
    async function setupContest() {
      try {
        if (!await waitForFirebase()) return;
        
        log('🎮 Setup Contest...', 'info');
        
        // Create matches document
        const matchesData = {
          G1: {
            homeTeam: "Athletic Brescia",
            awayTeam: "Polisportiva Virgiliana",
            deadline: "2025-10-27T14:00:00Z",
            result: null
          },
          G2: {
            homeTeam: "Athletic Brescia",
            awayTeam: "ASD Montichiari",
            deadline: "2025-11-03T14:00:00Z",
            result: null
          },
          G3: {
            homeTeam: "Athletic Brescia",
            awayTeam: "TBD",
            deadline: "2025-11-10T14:00:00Z",
            result: null
          }
        };
        
        await window.db.collection('contest').doc('matches').set(matchesData);
        log('✅ Document "matches" creato con G1, G2, G3', 'success');
        
        // Create empty scores document
        await window.db.collection('contest').doc('scores').set({});
        log('✅ Document "scores" creato (vuoto)', 'success');
        
        // Create settings
        const settingsData = {
          prize: "Felpa Ufficiale Athletic Brescia",
          active: true,
          seasonName: "Stagione 2024/25",
          points: {
            exact: 10,
            goalDiff: 5,
            winner: 2
          }
        };
        
        await window.db.collection('contest').doc('settings').set(settingsData);
        log('✅ Document "settings" creato', 'success');
        
        log('\n🎉 CONTEST SETUP COMPLETATO!', 'success');
        log('   📄 3 documents creati', 'success');
        log('   🏆 Premio: Felpa Athletic', 'info');
        log('   ⚽ Partite: G1, G2, G3 configurate', 'info');
        
        updateStatus('Contest Setup OK', 'ok');
        
      } catch (e) {
        log(`❌ Errore setup: ${e.message}`, 'error');
        updateStatus('Contest Setup Error', 'error');
      }
    }

    async function verifyContest() {
      try {
        if (!await waitForFirebase()) return;
        
        log('🔍 Verifica Contest...', 'info');
        
        // Check matches
        const matchesDoc = await window.db.collection('contest').doc('matches').get();
        if (matchesDoc.exists) {
          const matches = matchesDoc.data();
          const matchCount = Object.keys(matches).length;
          log(`✅ Matches: ${matchCount} giornate configurate`, 'success');
          
          Object.entries(matches).forEach(([key, match]) => {
            log(`   ${key}: ${match.homeTeam} vs ${match.awayTeam}`, 'info');
          });
        } else {
          log(`❌ Matches: document non trovato`, 'error');
        }
        
        // Check scores
        const scoresDoc = await window.db.collection('contest').doc('scores').get();
        if (scoresDoc.exists) {
          const scores = scoresDoc.data();
          const playerCount = Object.keys(scores).length;
          log(`✅ Scores: ${playerCount} giocatori`, 'success');
        } else {
          log(`❌ Scores: document non trovato`, 'error');
        }
        
        // Check settings
        const settingsDoc = await window.db.collection('contest').doc('settings').get();
        if (settingsDoc.exists) {
          const settings = settingsDoc.data();
          log(`✅ Settings: attivo=${settings.active}, premio="${settings.prize}"`, 'success');
        } else {
          log(`❌ Settings: document non trovato`, 'error');
        }
        
        updateStatus('Contest Verified', 'ok');
        
      } catch (e) {
        log(`❌ Errore verify: ${e.message}`, 'error');
        updateStatus('Verify Error', 'error');
      }
    }

    // ========== CALENDARIO ==========
    
    async function setupCalendario() {
      try {
        if (!await waitForFirebase()) return;
        
        log('📅 Setup Calendario Ottobre...', 'info');
        
        // Partite Ottobre 2024 (dai tuoi dati Instagram)
        const partiteOttobre = [
          {
            giornata: 1,
            month: 'Ottobre',
            date: '13 Ottobre',
            time: '15:00',
            homeTeam: 'Amatori Porta Romana 1',
            awayTeam: 'Athletic Brescia',
            homeScore: 1,
            awayScore: 1,
            location: 'Campo Porta Romana'
          },
          {
            giornata: 2,
            month: 'Ottobre',
            date: '22 Ottobre',
            time: '15:00',
            homeTeam: 'Athletic Brescia',
            awayTeam: 'IUE Calcio',
            homeScore: null,
            awayScore: null,
            location: null
          },
          {
            giornata: 3,
            month: 'Ottobre',
            date: '28 Ottobre',
            time: '15:00',
            homeTeam: 'Vicchio',
            awayTeam: 'Athletic Brescia',
            homeScore: null,
            awayScore: null,
            location: null
          }
        ];
        
        let added = 0;
        for (const match of partiteOttobre) {
          await window.db.collection('athletic_calendar').add({
            ...match,
            postponed: false,
            createdAt: new Date().toISOString()
          });
          added++;
          log(`✅ G${match.giornata}: ${match.homeTeam} vs ${match.awayTeam}`, 'success');
        }
        
        log(`\n🎉 CALENDARIO SETUP COMPLETATO!`, 'success');
        log(`   📄 ${added} partite aggiunte`, 'success');
        
        updateStatus(`Calendario: ${added} partite`, 'ok');
        
      } catch (e) {
        log(`❌ Errore setup: ${e.message}`, 'error');
        updateStatus('Calendario Setup Error', 'error');
      }
    }

    async function verifyCalendario() {
      try {
        if (!await waitForFirebase()) return;
        
        log('🔍 Verifica Calendario...', 'info');
        
        const snapshot = await window.db.collection('athletic_calendar')
          .orderBy('giornata', 'asc').get();
        
        const matches = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        log(`📅 Totale: ${matches.length} partite`, 'info');
        
        // Group by month
        const byMonth = {};
        matches.forEach(m => {
          byMonth[m.month] = (byMonth[m.month] || 0) + 1;
        });
        
        log('\n📊 Per mese:', 'info');
        Object.entries(byMonth).forEach(([month, count]) => {
          log(`   ${month}: ${count} partite`, 'success');
        });
        
        // Con risultato
        const withResults = matches.filter(m => m.homeScore !== null).length;
        log(`\n✅ Con risultato: ${withResults}`, withResults > 0 ? 'success' : 'info');
        log(`⏳ Da giocare: ${matches.length - withResults}`, 'info');
        
        updateStatus('Calendario Verified', 'ok');
        
      } catch (e) {
        log(`❌ Errore verify: ${e.message}`, 'error');
        updateStatus('Verify Error', 'error');
      }
    }

    // ========== ALL-IN-ONE ==========
    
    async function setupAll() {
      log('⚡ SETUP COMPLETO INIZIATO...', 'info');
      log('═══════════════════════════════════════', 'info');
      
      // 1. Upload regole
      log('\n📋 FASE 1: Upload Regole', 'info');
      await uploadRules();
      await new Promise(r => setTimeout(r, 1000));
      
      // 2. Setup contest
      log('\n\n🏆 FASE 2: Setup Contest', 'info');
      await setupContest();
      await new Promise(r => setTimeout(r, 1000));
      
      // 3. Setup calendario
      log('\n\n📅 FASE 3: Setup Calendario', 'info');
      await setupCalendario();
      await new Promise(r => setTimeout(r, 1000));
      
      // 4. Verify
      log('\n\n✅ FASE 4: Verifica Completa', 'info');
      await verifyRules();
      await new Promise(r => setTimeout(r, 500));
      await verifyContest();
      await new Promise(r => setTimeout(r, 500));
      await verifyCalendario();
      
      log('\n═══════════════════════════════════════', 'success');
      log('🎉 SETUP COMPLETO TERMINATO!', 'success');
      log('═══════════════════════════════════════', 'success');
      
      updateStatus('Setup Completo OK', 'ok');
    }

    // Init on load
    window.addEventListener('load', async () => {
      log('🚀 Admin Setup caricato', 'info');
      
      const ready = await waitForFirebase();
      if (ready) {
        updateStatus('Firebase Ready', 'ok');
      } else {
        updateStatus('Firebase Error', 'error');
      }
    });
  </script>
</body>
</html>
