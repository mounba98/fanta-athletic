<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Fix Utenti → Lega</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; max-width: 900px; margin: 0 auto; }
    .btn { padding: 12px 24px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px 5px; }
    .btn:hover { background: #2980b9; }
    .log { background: #f5f5f5; padding: 20px; border-radius: 8px; margin-top: 20px; max-height: 500px; overflow-y: auto; font-family: monospace; font-size: 13px; }
    .success { color: #27ae60; font-weight: bold; }
    .error { color: #e74c3c; font-weight: bold; }
    .warning { color: #f39c12; }
    .info { color: #3498db; }
    .code-box { background: #2c3e50; color: #ecf0f1; padding: 20px; border-radius: 8px; margin: 20px 0; font-size: 18px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>
  <h1>🔧 Fix Utenti → Associazione Lega</h1>
  <p>Associa utenti esistenti alla lega "Fanta Athletic"</p>
  
  <div id="inviteCodeBox" style="display:none;" class="code-box"></div>
  
  <div>
    <button class="btn" onclick="getLeagueInfo()">1️⃣ Info Lega Fanta Athletic</button>
    <button class="btn" onclick="addAllUsersToLeague()">2️⃣ Aggiungi Tutti Utenti</button>
    <button class="btn" onclick="updateUsersWithLeague()">3️⃣ Aggiorna Documenti Utenti</button>
    <button class="btn" onclick="addTeamOwnersToLeague()">4️⃣ Aggiungi Proprietari Squadre</button>
    <button class="btn" onclick="fixSpecificUsers()">5️⃣ Fix Utenti Specifici</button>
  </div>
  
  <div id="log" class="log">Pronto...</div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js?v=20251021-2"></script>
  <script>
    // Init Firebase SUBITO
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
  </script>
  <script>
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
    const db = firebase.firestore();
    
    let currentUser = null;
    let logEl = document.getElementById('log');
    let fantaAthleticLeagueId = null;
    
    firebase.auth().onAuthStateChanged(user => {
      if (!user) {
        log('❌ Non autenticato. Redirect...', 'error');
        setTimeout(() => location.href = 'auth.html', 2000);
      } else {
        currentUser = user;
        log(`✅ Autenticato: ${user.email}`, 'success');
      }
    });
    
    function log(message, type = 'info') {
      const timestamp = new Date().toLocaleTimeString();
      const className = type;
      logEl.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
      logEl.scrollTop = logEl.scrollHeight;
      console.log(message);
    }
    
    async function getLeagueInfo() {
      log('🔍 Cercando lega "Fanta Athletic"...', 'info');
      
      try {
        const leaguesSnap = await db.collection('leagues')
          .where('name', '==', 'Fanta Athletic')
          .limit(1)
          .get();
        
        if (leaguesSnap.empty) {
          log('❌ Lega "Fanta Athletic" non trovata!', 'error');
          log('⚠️ Esegui prima lo script di migrazione!', 'warning');
          return null;
        }
        
        const leagueDoc = leaguesSnap.docs[0];
        fantaAthleticLeagueId = leagueDoc.id;
        const league = leagueDoc.data();
        
        log('✅ Lega trovata!', 'success');
        log(`📋 ID: ${fantaAthleticLeagueId}`, 'info');
        log(`📋 Nome: ${league.name}`, 'info');
        log(`📋 Codice Invito: ${league.inviteCode}`, 'info');
        log(`👥 Membri: ${league.members?.length || 0}`, 'info');
        log(`👑 Admin: ${league.admins?.length || 0}`, 'info');
        
        // Show invite code prominently
        document.getElementById('inviteCodeBox').style.display = 'block';
        document.getElementById('inviteCodeBox').innerHTML = `
          🔑 CODICE INVITO: <span style="font-size: 32px; color: #f39c12;">${league.inviteCode}</span>
          <div style="font-size: 14px; margin-top: 10px; color: #95a5a6;">
            Dai questo codice agli utenti per unirsi alla lega
          </div>
        `;
        
        localStorage.setItem('last_league_id', fantaAthleticLeagueId);
        log('💾 ID salvato in localStorage', 'success');
        
        return fantaAthleticLeagueId;
        
      } catch (error) {
        log(`❌ Errore: ${error.message}`, 'error');
        return null;
      }
    }
    
    async function addAllUsersToLeague() {
      log('👥 Aggiungendo TUTTI gli utenti alla lega...', 'warning');
      
      if (!fantaAthleticLeagueId) {
        fantaAthleticLeagueId = await getLeagueInfo();
        if (!fantaAthleticLeagueId) return;
      }
      
      try {
        // Get all users
        const usersSnap = await db.collection('users').get();
        log(`📊 Trovati ${usersSnap.size} utenti`, 'info');
        
        const userIds = usersSnap.docs.map(doc => doc.id);
        
        if (userIds.length === 0) {
          log('⚠️ Nessun utente trovato!', 'warning');
          return;
        }
        
        // Add all to league
        await db.collection('leagues').doc(fantaAthleticLeagueId).update({
          members: firebase.firestore.FieldValue.arrayUnion(...userIds),
          'stats.activeMembers': userIds.length
        });
        
        log(`✅ Aggiunti ${userIds.length} utenti alla lega`, 'success');
        log('🎉 Operazione completata!', 'success');
        
        // List users
        usersSnap.forEach(doc => {
          const user = doc.data();
          log(`  ✓ ${user.displayName || user.email || doc.id}`, 'info');
        });
        
      } catch (error) {
        log(`❌ Errore: ${error.message}`, 'error');
      }
    }
    
    async function updateUsersWithLeague() {
      log('📝 Aggiornando documenti utenti con currentLeague...', 'warning');
      
      if (!fantaAthleticLeagueId) {
        fantaAthleticLeagueId = await getLeagueInfo();
        if (!fantaAthleticLeagueId) return;
      }
      
      try {
        // Get all users
        const usersSnap = await db.collection('users').get();
        log(`📊 Trovati ${usersSnap.size} utenti`, 'info');
        
        if (usersSnap.empty) {
          log('⚠️ Nessun utente trovato!', 'warning');
          return;
        }
        
        let updated = 0;
        let skipped = 0;
        
        // Update each user document
        for (const userDoc of usersSnap.docs) {
          const userId = userDoc.id;
          const userData = userDoc.data();
          
          // Check if user is already in league members
          const leagueDoc = await db.collection('leagues').doc(fantaAthleticLeagueId).get();
          const leagueData = leagueDoc.data();
          const isMember = leagueData.members && leagueData.members.includes(userId);
          
          if (!isMember) {
            log(`  ⏭️ ${userData.displayName || userData.email || userId} - non è membro, skip`, 'warning');
            skipped++;
            continue;
          }
          
          // Check if already has currentLeague set
          if (userData.currentLeague === fantaAthleticLeagueId) {
            log(`  ✓ ${userData.displayName || userData.email || userId} - già aggiornato`, 'info');
            skipped++;
            continue;
          }
          
          // Update user document
          await db.collection('users').doc(userId).set({
            currentLeague: fantaAthleticLeagueId,
            leagues: firebase.firestore.FieldValue.arrayUnion(fantaAthleticLeagueId),
            email: userData.email || '',
            displayName: userData.displayName || userData.email || 'Utente',
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
          
          log(`  ✅ ${userData.displayName || userData.email || userId} - aggiornato`, 'success');
          updated++;
        }
        
        log(`✅ Aggiornati ${updated} utenti`, 'success');
        log(`⏭️ Saltati ${skipped} utenti (già aggiornati o non membri)`, 'info');
        log('🎉 Operazione completata!', 'success');
        
      } catch (error) {
        log(`❌ Errore: ${error.message}`, 'error');
      }
    }
    
    async function addTeamOwnersToLeague() {
      log('🏆 Aggiungendo proprietari squadre alla lega...', 'warning');
      
      if (!fantaAthleticLeagueId) {
        fantaAthleticLeagueId = await getLeagueInfo();
        if (!fantaAthleticLeagueId) return;
      }
      
      try {
        // Get teams from OLD structure
        const teamsSnap = await db.collection('teams').get();
        log(`📊 Trovate ${teamsSnap.size} squadre (vecchia struttura)`, 'info');
        
        const ownerIds = new Set();
        teamsSnap.forEach(doc => {
          const team = doc.data();
          const ownerId = team.ownerId || team.userId;
          if (ownerId) {
            ownerIds.add(ownerId);
            log(`  ✓ Squadra "${team.name}": ${ownerId}`, 'info');
          }
        });
        
        // Get teams from NEW structure
        const newTeamsSnap = await db.collection(`leagues/${fantaAthleticLeagueId}/teams`).get();
        log(`📊 Trovate ${newTeamsSnap.size} squadre (nuova struttura)`, 'info');
        
        newTeamsSnap.forEach(doc => {
          const team = doc.data();
          const ownerId = team.ownerId || team.userId;
          if (ownerId) {
            ownerIds.add(ownerId);
          }
        });
        
        if (ownerIds.size === 0) {
          log('⚠️ Nessun proprietario trovato!', 'warning');
          return;
        }
        
        log(`👥 Trovati ${ownerIds.size} proprietari unici`, 'info');
        
        // Add to league
        await db.collection('leagues').doc(fantaAthleticLeagueId).update({
          members: firebase.firestore.FieldValue.arrayUnion(...Array.from(ownerIds))
        });
        
        log(`✅ Aggiunti ${ownerIds.size} proprietari alla lega`, 'success');
        log('🎉 Operazione completata!', 'success');
        
      } catch (error) {
        log(`❌ Errore: ${error.message}`, 'error');
      }
    }
    
    async function fixSpecificUsers() {
      log('🔧 Fix utenti specifici (admin + ospite)...', 'warning');
      
      if (!fantaAthleticLeagueId) {
        fantaAthleticLeagueId = await getLeagueInfo();
        if (!fantaAthleticLeagueId) return;
      }
      
      try {
        // Known admin UIDs
        const adminUIDs = [
          'fTaDr6Odn0fBpWS6e7QWOujmLlj1',
          'CXeiXAuPhxXqWMmBYag3XQ3AWty2',
          'vpkuHvL8JLS6V6iBdfLLV15doB23'
        ];
        
        log('👑 Aggiungendo admin alla lega...', 'info');
        
        await db.collection('leagues').doc(fantaAthleticLeagueId).update({
          members: firebase.firestore.FieldValue.arrayUnion(...adminUIDs),
          admins: firebase.firestore.FieldValue.arrayUnion(...adminUIDs)
        });
        
        log('✅ Admin aggiunti', 'success');
        
        // Add current user
        if (currentUser && !adminUIDs.includes(currentUser.uid)) {
          await db.collection('leagues').doc(fantaAthleticLeagueId).update({
            members: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
          });
          log(`✅ Utente corrente aggiunto: ${currentUser.email}`, 'success');
        }
        
        log('🎉 Fix completato!', 'success');
        log('🔄 Ricarica pagina tra 3 secondi...', 'warning');
        
        setTimeout(() => {
          location.href = 'index.html';
        }, 3000);
        
      } catch (error) {
        log(`❌ Errore: ${error.message}`, 'error');
      }
    }
  </script>
</body>
</html>
