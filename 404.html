<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagina non trovata | Fanta Athletic</title>
  <script src="resources/theme-preload.js?v=20260925b"></script>
  <link rel="stylesheet" href="resources/theme-tokens.css?v=20260920-final">
  <style>
    /* Pagina riscritta il 2026-09-20: prima era quella generata di
       default da Firebase (in inglese, con istruzioni per lo
       sviluppatore e nessun modo per tornare all'app). */
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .box {
      max-width: 460px;
      width: 100%;
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      text-align: center;
    }

    .box-top {
      background: linear-gradient(135deg, rgba(146, 1, 0, 0.92) 0%, rgba(12, 15, 109, 0.92) 100%);
      color: #fff;
      padding: 34px 24px;
    }

    .code {
      font-size: 54px;
      font-weight: 800;
      line-height: 1;
      margin: 0;
      letter-spacing: 0.02em;
    }

    .code-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .box-body { padding: 28px 24px 30px; }

    .box-body h1 {
      font-size: 21px;
      margin: 0 0 10px;
    }

    .box-body p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 15px;
    }

    .home-btn {
      display: inline-block;
      background-color: #920100;
      background-image: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.04) 45%, rgba(0,0,0,0.10) 100%);
      color: #fff;
      text-decoration: none;
      padding: 12px 26px;
      border: 1px solid rgba(0,0,0,0.18);
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(15,23,42,0.18);
      font-weight: 600;
    }

    .home-btn:active { transform: translateY(1px); }
  </style>
  <!-- Icone app (D105): logo Athletic 2018 su fondo #0c1318 -->
  <link rel="icon" type="image/png" sizes="32x32" href="/resources/app-icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/resources/app-icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="/resources/app-icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <div class="box">
    <div class="box-top">
      <span class="code-label">Fanta Athletic</span>
      <p class="code">404</p>
    </div>
    <div class="box-body">
      <h1>Questa pagina non esiste</h1>
      <p>L'indirizzo che hai aperto non corrisponde a nessuna pagina dell'app. Può succedere con un link vecchio o scritto male.</p>
      <a class="home-btn" href="index.html">Torna alla Home</a>
    </div>
  </div>
</body>
</html>
