<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Imposta Primo Admin</title>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
    .btn { padding: 12px 20px; background: #dc143c; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px 5px; font-size: 16px; }
    .btn:hover { background: #b01030; }
    .info { background: #e3f2fd; padding: 15px; border-radius: 8px; margin: 20px 0; border-left: 4px solid #2196f3; }
    .success { background: #e8f5e9; border-left-color: #4caf50; }
    .error { background: #ffebee; border-left-color: #f44336; }
    input { padding: 10px; border: 1px solid #ddd; border-radius: 8px; width: 100%; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>?? Imposta Primo Admin</h1>
  <div class="info">
    <p><strong>Questa pagina serve per impostare il primo amministratore.</strong></p>
    <p>1. Fai login con l'account che vuoi rendere admin</p>
    <p>2. Clicca "Rendimi Admin"</p>
    <p>3. Dopo potrai usare populate-data.html per caricare giocatori e regole</p>
  </div>

  <div id="userInfo"></div>
  
  <button class="btn" onclick="makeAdmin()" id="adminBtn" style="display:none;">??? Rendimi Admin</button>
  
  <div id="result"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js?v=20251021-2"></script>
  <script>
    // Init Firebase SUBITO
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
  </script>
  <script>
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    auth.onAuthStateChanged(async (user) => {
      const userInfo = document.getElementById('userInfo');
      const adminBtn = document.getElementById('adminBtn');
      
      if (!user) {
        userInfo.innerHTML = '<div class="info error">? Non sei loggato. <a href="auth.html">Vai al login</a></div>';
        return;
      }

      userInfo.innerHTML = `
        <div class="info">
          <p><strong>Utente loggato:</strong></p>
          <p>Email: ${user.email}</p>
          <p>UID: ${user.uid}</p>
        </div>
      `;

      // Controlla se già admin
      const adminDoc = await db.collection('admins').doc(user.uid).get();
      if (adminDoc.exists) {
        userInfo.innerHTML += '<div class="info success">? Sei già admin!</div>';
      } else {
        adminBtn.style.display = 'block';
      }
    });

    async function makeAdmin() {
      const user = auth.currentUser;
      if (!user) {
        alert('Non sei loggato!');
        return;
      }

      const result = document.getElementById('result');
      result.innerHTML = '<div class="info">? Impostazione admin in corso...</div>';

      try {
        await db.collection('admins').doc(user.uid).set({
          email: user.email,
          displayName: user.displayName || user.email,
          createdAt: Date.now(),
          role: 'admin'
        });

        result.innerHTML = `
          <div class="info success">
            <p>? <strong>Successo!</strong> Sei ora un amministratore.</p>
            <p>Puoi ora:</p>
            <ul>
              <li><a href="populate-data.html">Popolare il database</a></li>
              <li><a href="admin.html">Accedere al pannello admin</a></li>
            </ul>
          </div>
        `;
        document.getElementById('adminBtn').style.display = 'none';
      } catch (error) {
        result.innerHTML = `<div class="info error">? Errore: ${error.message}</div>`;
      }
    }
  </script>
</body>
</html>
