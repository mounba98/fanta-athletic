<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Join Code</title>
  <style>
    body {
      font-family: monospace;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #1e1e1e;
      color: #00ff00;
    }
    .result {
      background: #2d2d2d;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border-left: 4px solid #00ff00;
    }
    .error {
      border-left-color: #ff4444;
      color: #ff4444;
    }
    button {
      background: #007acc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background: #005a9e;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 200px;
      margin: 10px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <h1>🔍 Debug Join Code</h1>
  
  <div>
    <input type="text" id="codeInput" placeholder="CODICE" maxlength="6" />
    <button onclick="checkCode()">Verifica Codice</button>
  </div>
  
  <div id="results"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js"></script>
  <script>
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    // Check auth
    auth.onAuthStateChanged((user) => {
      if (!user) {
        log('⚠️ NON SEI LOGGATO! Fai login prima.', true);
        log(`🔗 Vai su: <a href="auth.html" style="color: #00bfff;">auth.html</a>`, false);
      } else {
        log(`✅ Loggato come: ${user.email}`);
      }
    });
    
    function log(message, isError = false) {
      const div = document.getElementById('results');
      const className = isError ? 'result error' : 'result';
      div.innerHTML += `<div class="${className}">${message}</div>`;
    }
    
    async function checkCode() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';
      
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      
      if (!code) {
        log('❌ Inserisci un codice', true);
        return;
      }
      
      log(`🔍 Cerco lega con codice: "${code}"`);
      log(`📏 Lunghezza codice: ${code.length}`);
      log(`🔤 Codice (hex): ${Array.from(code).map(c => c.charCodeAt(0).toString(16)).join(' ')}`);
      
      try {
        // Cerca lega con query
        const snapshot = await db.collection('leagues')
          .where('inviteCode', '==', code)
          .limit(1)
          .get();
        
        log(`📊 Query eseguita: .where('inviteCode', '==', '${code}')`);
        log(`📦 Risultati trovati: ${snapshot.size}`);
        
        if (snapshot.empty) {
          log('❌ Nessuna lega trovata con questo codice', true);
          
          // Proviamo a caricare TUTTE le leghe per vedere i codici
          log('🔍 Carico TUTTE le leghe per debug...');
          const allLeagues = await db.collection('leagues').get();
          log(`📊 Leghe totali nel database: ${allLeagues.size}`);
          
          allLeagues.docs.forEach(doc => {
            const data = doc.data();
            const storedCode = data.inviteCode || 'NESSUNO';
            log(`🏆 ${doc.id} - ${data.name || 'Senza nome'} - Codice: "${storedCode}"`);
            log(`   📏 Lunghezza: ${storedCode.length} | Hex: ${Array.from(storedCode).map(c => c.charCodeAt(0).toString(16)).join(' ')}`);
            
            if (storedCode === code) {
              log(`   ✅ MATCH! Questo è il codice giusto`, false);
            } else {
              log(`   ❌ NO MATCH: "${storedCode}" !== "${code}"`, true);
            }
          });
          
        } else {
          const leagueDoc = snapshot.docs[0];
          const leagueData = leagueDoc.data();
          
          log(`✅ LEGA TROVATA!`);
          log(`🏆 ID: ${leagueDoc.id}`);
          log(`📛 Nome: ${leagueData.name || 'Senza nome'}`);
          log(`🔑 Codice: ${leagueData.inviteCode}`);
          log(`👥 Membri: ${(leagueData.members || []).length}`);
          log(`👑 Admin: ${(leagueData.admins || []).length}`);
        }
        
      } catch (error) {
        log(`❌ ERRORE: ${error.message}`, true);
        console.error(error);
      }
    }
    
    // Auto-check URL params
    window.addEventListener('load', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const codeParam = urlParams.get('code');
      if (codeParam) {
        document.getElementById('codeInput').value = codeParam.toUpperCase();
        log(`🔗 Codice da URL: ${codeParam}`);
        setTimeout(() => checkCode(), 1000);
      }
    });
  </script>
</body>
</html>
