<!DOCTYPE html>
<html lang="it">
<head>
  <script src="resources/theme-preload.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin • Gestione Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="resources/sheet.css?v=202510172227" />
  <style>
    .container { max-width: 1000px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 20px; }
    .table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .table th, .table td { border-bottom: 1px solid rgba(0,0,0,0.08); padding: 8px 10px; text-align: left; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .input { padding: 10px 12px; border:1px solid #dbe1e8; border-radius: 10px; font-size: 14px; }
    .btn { padding: 10px 12px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <a class="logo-home" href="index.html" aria-label="Home">
      <img src="resources/logo.png" alt="Fanta Athletic" />
    </a>
    <h1>Admin • Gestione Admin</h1>
  </header>

  <main class="container">
    <section class="card">
      <h2>Aggiungi Admin</h2>
      <div class="row" style="align-items:stretch;">
        <input id="adminEmail" class="input" placeholder="Email utente" type="email" style="flex:1;" />
        <button class="btn" id="addAdminBtn" style="align-self:center;">➕ Aggiungi Admin</button>
      </div>
      <p style="color:var(--muted);font-size:12px;margin-top:8px;">L'utente deve essere già registrato. Inserisci la sua email.</p>
    </section>

    <section class="card">
      <h2>Admin Esistenti</h2>
      <table class="table" id="adminsTable">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>UID</th>
            <th>Azioni</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js?v=20251021-2"></script>
  <script>
    // Init Firebase SUBITO
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
  </script>
  <script>
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
    const db = firebase.firestore();
  </script>
  <script src="resources/app-init.js"></script>
  <script>
    let currentUser = null;

    firebase.auth().onAuthStateChanged(async (user)=>{
      if (!user) return location.href='auth.html';
      currentUser = user;
      const a = await db.collection('admins').doc(user.uid).get();
      if (!a.exists) return location.href='index.html';
      boot();
    });

    let adminsData = [];
    let usersMap = new Map();

    async function boot(){
      // Load all users
      const usersSnap = await db.collection('users').get();
      usersSnap.docs.forEach(d=> usersMap.set(d.id, d.data()));

      document.getElementById('addAdminBtn').onclick = async ()=>{
        const email = document.getElementById('adminEmail').value.trim().toLowerCase();
        if (!email) return alert('Email obbligatoria');
        
        // Find user by email
        const userEntry = Array.from(usersMap.entries()).find(([uid, data])=> data.email?.toLowerCase() === email);
        if (!userEntry) return alert('Utente non trovato. Deve essere già registrato.');
        
        const [uid, userData] = userEntry;
        
        // Check if already admin
        const adminDoc = await db.collection('admins').doc(uid).get();
        if (adminDoc.exists) return alert('Utente già admin');
        
        await db.collection('admins').doc(uid).set({ 
          email: userData.email,
          display_name: userData.display_name,
          addedAt: Date.now(),
          addedBy: currentUser.uid
        });
        
        document.getElementById('adminEmail').value='';
        alert('✅ Admin aggiunto!');
      };

      db.collection('admins').onSnapshot(s=>{
        adminsData = s.docs.map(d=>({id:d.id, ...d.data()}));
        renderAdmins();
      });
    }

    function renderAdmins(){
      const tb = document.querySelector('#adminsTable tbody');
      tb.innerHTML = adminsData.map(a=>{
        const userData = usersMap.get(a.id);
        const name = a.display_name || userData?.display_name || '—';
        const email = a.email || userData?.email || '—';
        const canDelete = a.id !== currentUser.uid; // Can't delete yourself
        
        return `<tr>
          <td>${name}</td>
          <td>${email}</td>
          <td style="font-family:monospace;font-size:11px;">${a.id}</td>
          <td>
            ${canDelete ? `<button class="btn btn-sm btn-secondary" onclick="deleteAdmin('${a.id}')">🗑️ Rimuovi</button>` : '<span style="color:var(--muted);font-size:12px;">Tu</span>'}
          </td>
        </tr>`;
      }).join('');
    }

    async function deleteAdmin(uid){
      if (!confirm('Rimuovere questo admin?')) return;
      await db.collection('admins').doc(uid).delete();
    }
  </script>
  <script src="resources/mobile-detect.js?v=2025101801"></script>
  <script src="resources/bottom-nav.js?v=2025101802"></script>
    <script src="resources/navbar-autohide.js?v=2025101805"></script>
  <script src="resources/theme.js?v=202510172227"></script>
  <script src="resources/navbar.js?v=202510172227"></script>
  <script src="resources/navbar-profile-icon.js?v=2025102001"></script>
  <script src="resources/notifications-dropdown.js?v=2025102002"></script>
</body>
</html>
