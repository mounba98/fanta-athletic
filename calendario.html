<head>

  <title>Calendario Scontri - Fanta Athletic</title>

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <style>
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .giornata-card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .giornata-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--primary);
    }
    .giornata-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
    }
    .giornata-date {
      color: var(--muted);
      font-size: 14px;
    }
    .scontri-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
    }
    .scontro {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
      padding: 15px;
      color: white;
      position: relative;
      overflow: hidden;
    }
    .scontro::before {
      content: 'VS';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 60px;
      font-weight: 900;
      opacity: 0.1;
    }
    .team {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      position: relative;
      z-index: 1;
    }
    .team-name {
      font-weight: 700;
      font-size: 16px;
    }
    .team-score {
      font-size: 24px;
      font-weight: 900;
      min-width: 50px;
      text-align: right;
    }
    .team.winner {
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 10px;
      margin: -2px 0;
    }
    .divider {
      height: 2px;
      background: rgba(255,255,255,0.3);
      margin: 10px 0;
    }
    .status {
      text-align: center;
      padding: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      margin-top: 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .status.played { background: rgba(76, 175, 80, 0.3); }
    .status.upcoming { background: rgba(255, 152, 0, 0.3); }
    .riposo { background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%); }
    .forfeit { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
    .forfeit-penalty { background: rgba(231, 76, 60, 0.3); border-radius: 8px; padding: 10px; margin: -2px 0; }
    .admin-controls { background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 20px; box-shadow: var(--shadow); }
  </style>
</head>
<body>
  <header>
    <a class="logo-home" href="index.html">
      <img src="resources/logo.png" alt="Fanta Athletic" />
    </a>
    <h1>📅 Calendario Scontri</h1>
  </header>

  <main class="container">
    <div id="adminControls" style="display:none;" class="admin-controls">
      <h3>Controlli Admin</h3>
      <div style="display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;">
        <div style="display:flex;align-items:center;gap:8px;">
          <label style="white-space:nowrap;">Numero Giornate:</label>
          <input type="number" id="numRounds" value="34" min="1" max="100" style="width:80px;padding:8px;border-radius:8px;border:1px solid #ddd;" />
        </div>
        <button class="btn" onclick="generateSchedule()">🔄 Genera Calendario</button>
        <button class="btn btn-secondary" onclick="clearResults()">🗑️ Cancella Risultati</button>
        <button class="btn" onclick="deleteCalendar()" style="background:#e74c3c;color:white;">❌ Elimina Calendario</button>
      </div>
    </div>
    <div id="calendario"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js?v=20251021-2"></script>
  <script>
    // Init Firebase SUBITO
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
  </script>
  
  <script>
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();
  </script>
  <script src="resources/app-init.js"></script>
  <script>
    const SEASON = '2024-25';
    let teamNames = [];
    let isAdmin = false;

    auth.onAuthStateChanged(async (user)=>{
      if (!user) return location.href='auth.html';
      const a = await db.collection('admins').doc(user.uid).get();
      isAdmin = a.exists;
      if (isAdmin) document.getElementById('adminControls').style.display='block';
      boot();
    });

    async function boot(){
      // Load team names
      const teamsSnap = await db.collection('teams').orderBy(firebase.firestore.FieldPath.documentId()).get();
      teamNames = teamsSnap.docs.map((d,i)=> d.data().name || `Squadra ${i+1}`);

      // Load schedule
      const schedSnap = await db.collection('h2h_schedule').doc(SEASON).collection('giornate').orderBy('giornata').get();
      if (schedSnap.empty && isAdmin){
        alert('Calendario vuoto. Clicca "Genera Calendario" per crearlo.');
        return;
      }

      // Load results
      const resSnap = await db.collection('h2h_results').doc(SEASON).collection('giornate').get();
      const resMap = new Map();
      resSnap.docs.forEach(d=> resMap.set(d.id, d.data()));

      const giornate = schedSnap.docs.map(d=>{
        const sched = d.data();
        const res = resMap.get(d.id) || {};
        return { giornata: sched.giornata, matches: sched.matches||[], bye: sched.bye, results: res.matches||[] };
      });

      renderCalendario(giornate);
    }

    function renderCalendario(giornate) {
      const container = document.getElementById('calendario');
      
      container.innerHTML = giornate.map(g => {
        const matchesHtml = g.matches.map((m,idx)=>{
          const homeName = teamNames[m.home] || `Squadra ${m.home+1}`;
          const awayName = teamNames[m.away] || `Squadra ${m.away+1}`;
          const res = g.results.find(r=> r.home===m.home && r.away===m.away) || {};
          const sh = res.scoreHome!=null ? res.scoreHome : null;
          const sa = res.scoreAway!=null ? res.scoreAway : null;
          const winner = sh!=null && sa!=null ? (sh>sa?'casa':sh<sa?'trasferta':'pareggio') : null;
          const status = sh!=null && sa!=null ? 'played' : 'upcoming';
          
          // Check for forfeit penalties
          const homeForfeit = res.forfeitHome === true;
          const awayForfeit = res.forfeitAway === true;

          return `
            <div class="scontro ${homeForfeit || awayForfeit ? 'forfeit' : ''}">
              <div class="team ${winner==='casa'?'winner':''} ${homeForfeit ? 'forfeit-penalty' : ''}">
                <span class="team-name">${homeName}${homeForfeit ? ' ⚠️' : ''}</span>
                <span class="team-score">${sh!=null ? sh.toFixed(1) : '-'}</span>
              </div>
              <div class="divider"></div>
              <div class="team ${winner==='trasferta'?'winner':''} ${awayForfeit ? 'forfeit-penalty' : ''}">
                <span class="team-name">${awayName}${awayForfeit ? ' ⚠️' : ''}</span>
                <span class="team-score">${sa!=null ? sa.toFixed(1) : '-'}</span>
              </div>
              <div class="status ${status}">
                ${status==='played' ? (homeForfeit || awayForfeit ? '⚠️ Penalità Formazione' : '✅ Giocata') : '⏳ Da giocare'}
              </div>
            </div>
          `;
        }).join('');

        const byeHtml = g.bye!=null ? `<div class="scontro riposo"><div class="team"><span class="team-name">${teamNames[g.bye]||`Squadra ${g.bye+1}`}</span></div><div class="status">🏖️ Riposo</div></div>` : '';

        return `
          <div class="giornata-card">
            <div class="giornata-header">
              <div class="giornata-title">Giornata ${g.giornata}</div>
            </div>
            <div class="scontri-grid">
              ${matchesHtml}
              ${byeHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    async function generateSchedule(){
      const numRounds = parseInt(document.getElementById('numRounds').value) || 34;
      const numTeams = teamNames.length;
      if (numTeams < 2) return alert('Serve almeno 2 squadre');
      if (!confirm(`Generare calendario per ${numTeams} squadre (${numRounds} giornate)?`)) return;
      const schedule = roundRobinN(numTeams, numRounds);
      const batch = db.batch();
      schedule.forEach((g,i)=>{
        const ref = db.collection('h2h_schedule').doc(SEASON).collection('giornate').doc(`G${i+1}`);
        batch.set(ref, { giornata: i+1, matches: g.matches, bye: g.bye });
      });
      await batch.commit();
      alert('✅ Calendario generato!');
      boot();
    }

    function roundRobinN(n, totalRounds){
      const teams = Array.from({length:n},(_,i)=>i);
      const rounds = [];
      const isOdd = n % 2 === 1;
      const activeCount = isOdd ? n : n;
      const maxRounds = isOdd ? n : (n-1)*2;
      
      for (let r=0; r<totalRounds; r++){
        const matches = [];
        let bye = null;
        
        if (isOdd){
          bye = teams[0];
          const active = teams.slice(1);
          for (let i=0; i<Math.floor(active.length/2); i++){
            const home = active[i];
            const away = active[active.length-1-i];
            if (r%2===0) matches.push({home,away});
            else matches.push({home:away,away:home});
          }
        } else {
          for (let i=0; i<n/2; i++){
            const home = teams[i];
            const away = teams[n-1-i];
            if (r%2===0) matches.push({home,away});
            else matches.push({home:away,away:home});
          }
        }
        
        rounds.push({ matches, bye });
        // Rotate (keep first fixed if odd)
        if (isOdd) teams.splice(1,0,teams.pop());
        else teams.splice(0,0,teams.pop());
      }
      return rounds;
    }

    async function clearResults(){
      if (!confirm('Cancellare tutti i risultati?')) return;
      const snap = await db.collection('h2h_results').doc(SEASON).collection('giornate').get();
      const batch = db.batch();
      snap.docs.forEach(d=> batch.delete(d.ref));
      await batch.commit();
      alert('✅ Risultati cancellati!');
      boot();
    }

    async function deleteCalendar(){
      if (!confirm('⚠️ ATTENZIONE: Eliminare TUTTO il calendario? Questa azione è irreversibile!')) return;
      if (!confirm('Sei davvero sicuro? Verranno eliminati calendario E risultati!')) return;
      
      // Elimina calendario
      const schedSnap = await db.collection('h2h_schedule').doc(SEASON).collection('giornate').get();
      const batch1 = db.batch();
      schedSnap.docs.forEach(d=> batch1.delete(d.ref));
      await batch1.commit();
      
      // Elimina risultati
      const resSnap = await db.collection('h2h_results').doc(SEASON).collection('giornate').get();
      const batch2 = db.batch();
      resSnap.docs.forEach(d=> batch2.delete(d.ref));
      await batch2.commit();
      
      alert('✅ Calendario e risultati eliminati!');
      location.reload();
    }
  </script>
