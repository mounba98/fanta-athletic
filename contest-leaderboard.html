<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classifica Contest | Athletic Brescia</title>
  <script src="resources/theme-preload.js?v=20260925b"></script>
  <!-- Questa pagina usava var(--bg)/var(--text)/var(--card) senza mai
       caricare il foglio di stile che le definisce: colori e font
       restavano fuori dal tema dell'app. Collegato theme-tokens.css
       (2026-09-20). -->
  <link rel="stylesheet" href="resources/theme-tokens.css?v=20260920-final">
  <style>
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    
    .hero {
      background: linear-gradient(135deg, #920100 0%, #0c0f6d 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
    }
    
    .hero h1 {
      font-size: clamp(26px, 5vw, 36px);
      margin: 0 0 10px;
      font-weight: 900;
    }
    
    .container {
      max-width: 1000px;
      margin: 20px auto 40px;
      padding: 0 20px;
    }
    
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 30px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .leaderboard-table thead {
      background: rgba(148,163,184,0.12);
      border-bottom: 1px solid rgba(148,163,184,0.3);
    }
    
    .leaderboard-table th {
      padding: 15px;
      text-align: left;
      font-weight: 700;
      color: var(--muted);
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    
    .leaderboard-table td {
      padding: 18px 15px;
      border-bottom: 1px solid #f3f4f6;
    }
    
    .position {
      font-size: 1.5rem;
      font-weight: 900;
      width: 60px;
      text-align: center;
    }
    
    .position.gold {
      color: #facc15;
    }
    
    .position.silver {
      color: var(--muted);
    }
    
    .position.bronze {
      color: #d97706;
    }
    
    .player-name {
      font-weight: 700;
      font-size: 1.1rem;
    }
    
    .player-email {
      color: var(--muted);
      font-size: 0.85rem;
    }
    
    .points {
      font-size: 1.8rem;
      font-weight: 900;
      color: #0c0f6d;
      text-align: right;
    }
    
    .my-row {
      background: rgba(12,15,109,0.12);
      border: 1px solid rgba(12,15,109,0.45);
    }
    
    .back-btn {
      display: inline-block;
      padding: 12px 24px;
      background: #0c0f6d;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    /* Questa pagina non carica sheet.css (D050), quindi non ha il menu
       condiviso: una barra minima e autosufficiente per non restare
       "bloccati" qui dentro (navigabilità, D067). */
    .mini-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: #0c0f6d;
    }
    .mini-nav a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .mini-nav img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }
    
    .team-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .team-tile { border-radius:12px; padding:18px 10px; text-align:center; color:#fff; font-weight:700; }
    .team-tile.curva { background:#920100; }
    .team-tile.piana { background:#0c0f6d; }
    .team-pts { font-size:2.2rem; font-weight:900; margin:6px 0; }
    .team-sub { font-size:.8rem; font-weight:500; opacity:.9; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-box {
      background: rgba(148,163,184,0.12);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 2rem;
      font-weight: 900;
      color: #0c0f6d;
    }
    
    .stat-label {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 5px;
    }
    
    @media (max-width: 640px) {
      .leaderboard-table {
        font-size: 0.9rem;
      }
      .leaderboard-table th,
      .leaderboard-table td {
        padding: 10px 8px;
      }
      .position {
        font-size: 1.2rem;
        width: 40px;
      }
      .points {
        font-size: 1.3rem;
      }
      .player-email {
        display: none;
      }
    }
  </style>
  <!-- Icone app (D105): logo Athletic 2018 su fondo #0c1318 -->
  <link rel="icon" type="image/png" sizes="32x32" href="/resources/app-icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/resources/app-icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="/resources/app-icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <div class="mini-nav">
    <a href="index.html">
      <img src="resources/logo.png" alt="Fanta Athletic" />
      Home
    </a>
  </div>
  <!-- Hero -->
  <div class="hero">
    <h1>Classifica Contest</h1>
    <p>Indovina il Risultato - Stagione 2024/25</p>
  </div>

  <!-- Container -->
  <div class="container">
    <a href="contest.html" class="back-btn">Torna al Contest</a>

    <!-- Classifica per team -->
    <div class="card">
      <h2 style="margin-top:0;">Curva Morello vs Piana</h2>
      <div class="team-grid" id="teamGrid">
        <div class="team-tile curva"><div>Curva Morello</div><div class="team-pts" id="curvaPts">-</div><div class="team-sub" id="curvaSub"></div></div>
        <div class="team-tile piana"><div>Piana</div><div class="team-pts" id="pianaPts">-</div><div class="team-sub" id="pianaSub"></div></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="card">
      <h2 style="margin-top:0;">Statistiche</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-value" id="totalPlayers">-</div>
          <div class="stat-label">Partecipanti</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="totalPredictions">-</div>
          <div class="stat-label">Pronostici Totali</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="avgPoints">-</div>
          <div class="stat-label">Media Punti</div>
        </div>
      </div>
    </div>

    <!-- Leaderboard -->
    <div class="card">
      <h2 style="margin-top:0;">Classifica Generale</h2>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Giocatore</th>
            <th style="text-align:right;">Punti</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr>
            <td colspan="3" style="text-align:center;padding:40px;color:#6b7280;">
              Caricamento classifica...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="resources/navbar.js?v=20260925"></script>
  <script src="resources/firebase-app-compat.js"></script>
  <script src="resources/firebase-auth-compat.js"></script>
  <script src="resources/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js"></script>

  <script>
    function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
    let state = {
      user: null,
      scores: []
    };

    async function init() {
      // Wait for Firebase
      let retries = 0;
      while ((!window.auth || !window.db) && retries < 50) {
        await new Promise(resolve => setTimeout(resolve, 100));
        retries++;
      }

      if (!window.auth || !window.db) {
        console.error('Firebase not available');
        return;
      }

      window.auth.onAuthStateChanged(async (user) => {
        state.user = user;
        await loadScores();
      });
    }

    async function loadScores() {
      try {
        // Classifica calcolata da admin-contest.html: contest_standings/current
        const snap = await window.db.collection('contest_standings').doc('current').get();

        if (!snap.exists) {
          document.getElementById('leaderboardBody').innerHTML = `
            <tr>
              <td colspan="3" style="text-align:center;padding:40px;color:#6b7280;">
                Nessun punteggio ancora disponibile
              </td>
            </tr>
          `;
          renderTeams(null);
          return;
        }

        const data = snap.data();
        const scoresArray = Object.entries(data.users || {}).map(([userId, u]) => ({
          userId,
          name: u.name || 'Anonimo',
          faction: u.faction || '',
          totalPoints: u.points || 0,
          predictions: u.predictions || 0
        }));

        scoresArray.sort((a, b) => b.totalPoints - a.totalPoints);

        state.scores = scoresArray;
        renderTeams(data.teams);
        renderLeaderboard();
        renderStats();
      } catch (e) {
        console.error('Load error:', e);
      }
    }

    function renderTeams(teams) {
      const t = teams || { curva: { points: 0, players: 0 }, piana: { points: 0, players: 0 } };
      ['curva', 'piana'].forEach(id => {
        const x = t[id] || { points: 0, players: 0 };
        document.getElementById(id + 'Pts').textContent = x.points;
        const avg = x.players ? (x.points / x.players).toFixed(1) : '0';
        document.getElementById(id + 'Sub').textContent = x.players + ' giocatori • media ' + avg;
      });
    }

    function renderLeaderboard() {
      const tbody = document.getElementById('leaderboardBody');
      let html = '';

      if (state.scores.length === 0) {
        html = `
          <tr>
            <td colspan="3" style="text-align:center;padding:40px;color:#6b7280;">
              Nessun partecipante ancora
            </td>
          </tr>
        `;
      } else {
        state.scores.forEach((player, index) => {
          const position = index + 1;
          let positionClass = '';
          let positionIcon = position;

          if (position === 1) {
            positionClass = 'gold';
            positionIcon = '🥇';
          } else if (position === 2) {
            positionClass = 'silver';
            positionIcon = '🥈';
          } else if (position === 3) {
            positionClass = 'bronze';
            positionIcon = '🥉';
          }

          const isMe = state.user && player.userId === state.user.uid;
          const rowClass = isMe ? 'my-row' : '';

          html += `
            <tr class="${rowClass}">
              <td class="position ${positionClass}">${positionIcon}</td>
              <td>
                <div class="player-name">${esc(player.name)}${isMe ? ' (Tu)' : ''}</div>
                <div class="player-email">${player.faction === 'curva' ? 'Curva Morello' : (player.faction === 'piana' ? 'Piana' : '')}</div>
              </td>
              <td class="points">${player.totalPoints}</td>
            </tr>
          `;
        });
      }

      tbody.innerHTML = html;
    }

    function renderStats() {
      const totalPlayers = state.scores.length;
      const totalPredictions = state.scores.reduce((sum, p) => sum + p.predictions, 0);
      const avgPoints = totalPlayers > 0 
        ? (state.scores.reduce((sum, p) => sum + p.totalPoints, 0) / totalPlayers).toFixed(1)
        : '0';

      document.getElementById('totalPlayers').textContent = totalPlayers;
      document.getElementById('totalPredictions').textContent = totalPredictions;
      document.getElementById('avgPoints').textContent = avgPoints;
    }

    init();
  </script>
</body>
</html>
