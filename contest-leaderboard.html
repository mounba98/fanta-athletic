<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classifica Contest | Athletic Brescia</title>
  <link rel="icon" href="resources/favicon.ico">
  <link rel="stylesheet" href="resources/theme.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    
    .hero {
      background: linear-gradient(135deg, #dc2626 0%, #2d6cdf 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
    }
    
    .hero h1 {
      font-size: 2rem;
      margin: 0 0 10px;
      font-weight: 900;
    }
    
    .container {
      max-width: 1000px;
      margin: 20px auto 40px;
      padding: 0 20px;
    }
    
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 30px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .leaderboard-table thead {
      background: #f9fafb;
      border-bottom: 2px solid #e5e7eb;
    }
    
    .leaderboard-table th {
      padding: 15px;
      text-align: left;
      font-weight: 700;
      color: #6b7280;
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    
    .leaderboard-table td {
      padding: 18px 15px;
      border-bottom: 1px solid #f3f4f6;
    }
    
    .position {
      font-size: 1.5rem;
      font-weight: 900;
      width: 60px;
      text-align: center;
    }
    
    .position.gold {
      color: #fbbf24;
    }
    
    .position.silver {
      color: #9ca3af;
    }
    
    .position.bronze {
      color: #d97706;
    }
    
    .player-name {
      font-weight: 700;
      font-size: 1.1rem;
    }
    
    .player-email {
      color: #6b7280;
      font-size: 0.85rem;
    }
    
    .points {
      font-size: 1.8rem;
      font-weight: 900;
      color: #2d6cdf;
      text-align: right;
    }
    
    .my-row {
      background: #eff6ff;
      border: 2px solid #2d6cdf;
    }
    
    .back-btn {
      display: inline-block;
      padding: 12px 24px;
      background: #2d6cdf;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-box {
      background: #f9fafb;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 2rem;
      font-weight: 900;
      color: #2d6cdf;
    }
    
    .stat-label {
      color: #6b7280;
      font-size: 0.9rem;
      margin-top: 5px;
    }
    
    @media (max-width: 640px) {
      .leaderboard-table {
        font-size: 0.9rem;
      }
      .leaderboard-table th,
      .leaderboard-table td {
        padding: 10px 8px;
      }
      .position {
        font-size: 1.2rem;
        width: 40px;
      }
      .points {
        font-size: 1.3rem;
      }
      .player-email {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="navbar-container"></div>
  <!-- Hero -->
  <div class="hero">
    <h1>📊 Classifica Contest</h1>
    <p>Indovina il Risultato - Stagione 2024/25</p>
  </div>

  <!-- Container -->
  <div class="container">
    <a href="contest.html" class="back-btn">← Torna al Contest</a>

    <!-- Stats -->
    <div class="card">
      <h2 style="margin-top:0;">📈 Statistiche</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-value" id="totalPlayers">-</div>
          <div class="stat-label">Partecipanti</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="totalPredictions">-</div>
          <div class="stat-label">Pronostici Totali</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="avgPoints">-</div>
          <div class="stat-label">Media Punti</div>
        </div>
      </div>
    </div>

    <!-- Leaderboard -->
    <div class="card">
      <h2 style="margin-top:0;">🏆 Classifica Generale</h2>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Giocatore</th>
            <th style="text-align:right;">Punti</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr>
            <td colspan="3" style="text-align:center;padding:40px;color:#6b7280;">
              Caricamento classifica...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="resources/navbar.js?v=2025110701"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js"></script>

  <script>
    let state = {
      user: null,
      scores: []
    };

    async function init() {
      // Wait for Firebase
      let retries = 0;
      while ((!window.auth || !window.db) && retries < 50) {
        await new Promise(resolve => setTimeout(resolve, 100));
        retries++;
      }

      if (!window.auth || !window.db) {
        console.error('Firebase not available');
        return;
      }

      window.auth.onAuthStateChanged(async (user) => {
        state.user = user;
        await loadScores();
      });
    }

    async function loadScores() {
      try {
        const scoresSnap = await window.db.collection('contest').doc('scores').get();
        
        if (!scoresSnap.exists) {
          document.getElementById('leaderboardBody').innerHTML = `
            <tr>
              <td colspan="3" style="text-align:center;padding:40px;color:#6b7280;">
                Nessun punteggio ancora disponibile
              </td>
            </tr>
          `;
          return;
        }

        const scoresData = scoresSnap.data();
        const scoresArray = [];

        // Convert object to array
        for (const [userId, userData] of Object.entries(scoresData)) {
          scoresArray.push({
            userId,
            name: userData.name || userData.email || 'Anonimo',
            email: userData.email || '',
            totalPoints: userData.totalPoints || 0,
            predictions: userData.predictions || 0
          });
        }

        // Sort by points
        scoresArray.sort((a, b) => b.totalPoints - a.totalPoints);
        
        state.scores = scoresArray;
        renderLeaderboard();
        renderStats();
      } catch (e) {
        console.error('Load error:', e);
      }
    }

    function renderLeaderboard() {
      const tbody = document.getElementById('leaderboardBody');
      let html = '';

      if (state.scores.length === 0) {
        html = `
          <tr>
            <td colspan="3" style="text-align:center;padding:40px;color:#6b7280;">
              Nessun partecipante ancora
            </td>
          </tr>
        `;
      } else {
        state.scores.forEach((player, index) => {
          const position = index + 1;
          let positionClass = '';
          let positionIcon = position;

          if (position === 1) {
            positionClass = 'gold';
            positionIcon = '🥇';
          } else if (position === 2) {
            positionClass = 'silver';
            positionIcon = '🥈';
          } else if (position === 3) {
            positionClass = 'bronze';
            positionIcon = '🥉';
          }

          const isMe = state.user && player.userId === state.user.uid;
          const rowClass = isMe ? 'my-row' : '';

          html += `
            <tr class="${rowClass}">
              <td class="position ${positionClass}">${positionIcon}</td>
              <td>
                <div class="player-name">${player.name}${isMe ? ' (Tu)' : ''}</div>
                <div class="player-email">${player.email}</div>
              </td>
              <td class="points">${player.totalPoints}</td>
            </tr>
          `;
        });
      }

      tbody.innerHTML = html;
    }

    function renderStats() {
      const totalPlayers = state.scores.length;
      const totalPredictions = state.scores.reduce((sum, p) => sum + p.predictions, 0);
      const avgPoints = totalPlayers > 0 
        ? (state.scores.reduce((sum, p) => sum + p.totalPoints, 0) / totalPlayers).toFixed(1)
        : '0';

      document.getElementById('totalPlayers').textContent = totalPlayers;
      document.getElementById('totalPredictions').textContent = totalPredictions;
      document.getElementById('avgPoints').textContent = avgPoints;
    }

    init();
  </script>
</body>
</html>
