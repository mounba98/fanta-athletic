<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Risultato H2H</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0c0f6d 0%, #920100 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .modal {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 800px;
      width: 100%;
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #920100 0%, #5c0000 100%);
      color: white;
      padding: 32px 24px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    
    .giornata {
      font-size: 14px;
      opacity: 0.9;
    }
    
    .vs-container {
      padding: 40px 24px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
    }
    
    .team {
      text-align: center;
    }
    
    .team-logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #f0f0f0;
      object-fit: cover;
      margin: 0 auto 16px;
    }
    
    .team-name {
      font-size: 20px;
      font-weight: 700;
      color: #333;
      margin-bottom: 8px;
    }
    
    .team-owner {
      font-size: 14px;
      color: #666;
      margin-bottom: 16px;
    }
    
    .score {
      font-size: 48px;
      font-weight: 900;
      color: #920100;
    }
    
    .vs {
      font-size: 32px;
      font-weight: 700;
      color: #999;
    }
    
    .winner-badge {
      display: inline-block;
      background: linear-gradient(135deg, #facc15 0%, #facc15 100%);
      color: #000;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(250, 204, 21, 0.4);
    }
    
    .stats-grid {
      padding: 24px;
      background: #f8f9fa;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    
    .stat {
      background: white;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }
    
    .stat-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #333;
    }
    
    .actions {
      padding: 24px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    
    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #920100;
      color: white;
    }
    
    .btn-primary:hover {
      background: #740100;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(146, 1, 0, 0.3);
    }
    
    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #d0d0d0;
    }
    
    @media (max-width: 600px) {
      .vs-container {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      
      .vs {
        transform: rotate(90deg);
      }
      
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <!-- Icone app (D105): logo Athletic 2018 su fondo #0c1318 -->
  <link rel="icon" type="image/png" sizes="32x32" href="/resources/app-icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/resources/app-icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="/resources/app-icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <div class="modal">
    <div class="header">
      <h1>Risultato H2H</h1>
      <div class="giornata">Giornata <span id="giornataNum">1</span> • <span id="matchDate">20/10/2025</span></div>
    </div>
    
    <div class="vs-container">
      <!-- Team Home -->
      <div class="team">
        <img src="resources/logo.png" alt="Team 1" class="team-logo" id="team1Logo" />
        <div class="team-name" id="team1Name">Team 1</div>
        <div class="team-owner" id="team1Owner">Owner 1</div>
        <div class="score" id="team1Score">75.5</div>
        <div id="winner1Badge"></div>
      </div>
      
      <div class="vs">VS</div>
      
      <!-- Team Away -->
      <div class="team">
        <img src="resources/logo.png" alt="Team 2" class="team-logo" id="team2Logo" />
        <div class="team-name" id="team2Name">Team 2</div>
        <div class="team-owner" id="team2Owner">Owner 2</div>
        <div class="score" id="team2Score">68.0</div>
        <div id="winner2Badge"></div>
      </div>
    </div>
    
    <div class="stats-grid">
      <div class="stat">
        <div class="stat-label">Bonus <span id="team1NameShort"></span></div>
        <div class="stat-value" id="team1Bonus">+12</div>
      </div>
      <div class="stat">
        <div class="stat-label">Bonus <span id="team2NameShort"></span></div>
        <div class="stat-value" id="team2Bonus">+8</div>
      </div>
      <div class="stat">
        <div class="stat-label">Malus <span id="team1NameShort2"></span></div>
        <div class="stat-value" id="team1Malus">-3</div>
      </div>
      <div class="stat">
        <div class="stat-label">Malus <span id="team2NameShort2"></span></div>
        <div class="stat-value" id="team2Malus">-5</div>
      </div>
    </div>
    
    <div class="actions">
      <button class="btn btn-secondary" onclick="window.close()">Chiudi</button>
      <button class="btn btn-primary" onclick="goToCalendario()">Calendario</button>
      <button class="btn btn-primary" onclick="goToClassifiche()">Classifica</button>
    </div>
  </div>
  
  <script>
    // Parse URL params
    const params = new URLSearchParams(window.location.search);
    const giornata = params.get('giornata') || '1';
    const team1 = params.get('team1') || 'Team 1';
    const team2 = params.get('team2') || 'Team 2';
    const score1 = params.get('score1') || '0';
    const score2 = params.get('score2') || '0';
    
    // Populate
    document.getElementById('giornataNum').textContent = giornata;
    document.getElementById('team1Name').textContent = team1;
    document.getElementById('team2Name').textContent = team2;
    document.getElementById('team1Score').textContent = score1;
    document.getElementById('team2Score').textContent = score2;
    
    // Winner badge
    const s1 = parseFloat(score1);
    const s2 = parseFloat(score2);
    
    if (s1 > s2) {
      document.getElementById('winner1Badge').innerHTML = '<span class="winner-badge">🏆 VINCITORE</span>';
    } else if (s2 > s1) {
      document.getElementById('winner2Badge').innerHTML = '<span class="winner-badge">🏆 VINCITORE</span>';
    } else {
      document.getElementById('winner1Badge').innerHTML = '<span class="winner-badge" style="background: #90EE90;">🤝 PAREGGIO</span>';
      document.getElementById('winner2Badge').innerHTML = '<span class="winner-badge" style="background: #90EE90;">🤝 PAREGGIO</span>';
    }
    
    // Short names for stats
    const short1 = team1.split(' ')[0];
    const short2 = team2.split(' ')[0];
    document.getElementById('team1NameShort').textContent = short1;
    document.getElementById('team2NameShort').textContent = short2;
    document.getElementById('team1NameShort2').textContent = short1;
    document.getElementById('team2NameShort2').textContent = short2;
    
    function goToCalendario() {
      window.location.href = 'calendario.html?giornata=' + giornata;
    }
    
    function goToClassifiche() {
      window.location.href = 'classifiche.html';
    }
  </script>
</body>
</html>
