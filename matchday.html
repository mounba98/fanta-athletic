    function renderCurvaTab(){
      const SPECIAL_CURVA_RULE = 'infortunati_squalificati_curva';
      const vrules = normalizeCurvaRules({ rules: state.rules });
      const panel = $('#panelContent'); panel.innerHTML = '';
      const wrap = document.createElement('div'); wrap.className='curva-wrap';
      const group = { Casa:[], Trasferta:[], Generico:[] };
      const isCasa = (n)=> /casa/i.test(n||'');
      const isTrasferta = (n)=> /trasferta/i.test(n||'');
      const MULTI = [/gol/i, /ammoni/i, /toccate?\s+di\s+capelli/i, /esultan/i, /gesti?\s+sportivi/i, /rigori?\s+sbagliati/i, /rigori?\s+parati/i, /parat[ae]\s+decisiv/i, /pallone\s+perso/i];
      const getRuleId = (rule) => (rule?.rule_id || rule?.id || '').toString();

      let specialRule = null;

      vrules.forEach(r=>{
        const rid = getRuleId(r);
        if (!rid) return;
        if (rid.toLowerCase() === SPECIAL_CURVA_RULE) {
          specialRule = { ...r, __rid: rid };
          return;
        }
        const name = r.nome_bonus||'';
        const key = isTrasferta(name)? 'Trasferta' : (isCasa(name)? 'Casa' : 'Generico');
        group[key].push(r);
      });

      const renderRuleRow = (r) => {
        const rid = getRuleId(r);
        const val = Number(r.valore||0);
        const cur = Number(state.selCurva[rid]||0);
          const wantCounter = (r.input==='counter') || MULTI.some(re=> re.test(r.nome_bonus||''));
          return `
            <div class="rule" data-rule-id="${rid}">
              <div style="display:flex;align-items:center;gap:8px;">
                <span>${r.nome_bonus}</span>
                <span class="muted">${val>0?'+':''}${val}${wantCounter?' cad.':''}</span>
              </div>
              ${ wantCounter ? `
              <div style="display:flex;align-items:center;gap:6px;">
                <button class="chip" data-act="dec" ${!state.isAdmin?'disabled':''}>-</button>
                <span class="muted">x</span>
                <span>${cur}</span>
                <button class="chip" data-act="inc" ${!state.isAdmin?'disabled':''}>+</button>
              </div>` : `
              <label class="row" style="gap:6px;">
                <input type="checkbox" data-act="toggle" ${cur? 'checked':''} ${!state.isAdmin?'disabled':''}/>
              </label>`}
            </div>`;
      };

      const renderSpecialRule = () => {
        if (!specialRule) return '';
        const rid = specialRule.__rid || getRuleId(specialRule) || SPECIAL_CURVA_RULE;
        const val = Number(specialRule.valore || 0);
        const cur = Number(state.selCurva[rid]||0);
        const unit = val ? `${val>0?'+':''}${val} cad.` : '+1 cad.';
        return `
          <div class="rule" data-rule-id="${rid}" style="border:2px solid #10b981; background:rgba(16,185,129,0.05); padding:8px; border-radius:8px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-weight:700;">${specialRule.nome_bonus || 'Infortunati/Squalificati in Curva'}</span>
              <span class="muted">${unit}</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <button class="chip" data-act="dec" ${!state.isAdmin?'disabled':''}>-</button>
              <span class="muted">x</span>
              <span style="font-weight:700; font-size:16px;">${cur}</span>
              <button class="chip" data-act="inc" ${!state.isAdmin?'disabled':''}>+</button>
            </div>
          </div>
        `;
      };

      const buildSection = (title) => {
        const items = group[title] || [];
        const hasSpecial = title === 'Generico' && specialRule;
        const filteredItems = title === 'Generico'
          ? items.filter(r => getRuleId(r).toLowerCase() !== SPECIAL_CURVA_RULE)
          : items;

        let body = '';
        if (title === 'Generico') {
          const bonusItems = filteredItems.filter(r => Number(r.valore||0) >= 0);
          const malusItems = filteredItems.filter(r => Number(r.valore||0) < 0);
          if (bonusItems.length) {
            body += `<div class="curva-subtitle">Bonus</div>${bonusItems.map(renderRuleRow).join('')}`;
          }
          if (malusItems.length) {
            body += `<div class="curva-subtitle malus">Malus</div>${malusItems.map(renderRuleRow).join('')}`;
          }
        } else {
          body = filteredItems.map(renderRuleRow).join('');
        }

        if (!body && !hasSpecial && title !== 'Generico') return '';
        const specialHtml = hasSpecial ? renderSpecialRule() : '';
        const emptyMsg = (!specialHtml && !body) ? `<div class="muted" style="font-size:12px;">Nessuna regola disponibile</div>` : '';

        return `
          <div class="curva-section" data-curva="${title}">
            <div class="curva-header">${title} <span>▾</span></div>
            <div class="curva-body">
              ${specialHtml}
              ${body || ''}
              ${emptyMsg}
            </div>
          </div>`;
      };

      wrap.innerHTML = ['Generico','Casa','Trasferta'].map(buildSection).join('');
      panel.appendChild(wrap);
      // listeners
      if (state.isAdmin){
        $$('.curva-section .rule [data-act="toggle"]').forEach(cb=>cb.addEventListener('change',()=>{
          const row=cb.closest('.rule'); const rid=row.dataset.ruleId; state.selCurva[rid]=cb.checked?1:0; saveDay(); renderCurvaTab(); renderSummary();
        }));
        $$('.curva-section .rule [data-act="inc"]').forEach(btn=>btn.addEventListener('click',()=>{
          const row=btn.closest('.rule'); const rid=row.dataset.ruleId; const cur=Number(state.selCurva[rid]||0); state.selCurva[rid]=Math.min(50,cur+1); saveDay(); renderCurvaTab(); renderSummary();
        }));
        $$('.curva-section .rule [data-act="dec"]').forEach(btn=>btn.addEventListener('click',()=>{
          const row=btn.closest('.rule'); const rid=row.dataset.ruleId; const cur=Number(state.selCurva[rid]||0); state.selCurva[rid]=Math.max(0,cur-1); saveDay(); renderCurvaTab(); renderSummary();
        }));
        $$('.curva-section .curva-header').forEach(h=> h.addEventListener('click', ()=> h.parentElement.classList.toggle('collapsed')));
      }
    }

    async function safeLoadJson(url){

    async function loadPlayers(){
      let base = [];
      let leagueId = state.leagueId || await getLeagueIdOrNotify('caricare i giocatori', { notify: false });

      if (leagueId && LEAGUES_WITH_CUSTOM_PLAYER_FILES.has(leagueId)){
        const leaguePlayers = await safeLoadJson(`resources/players_${leagueId}.json`);
        if (leaguePlayers && Array.isArray(leaguePlayers.players)){
          base = leaguePlayers.players;
        }
      }
      if (!base.length){
        const globalPlayers = await safeLoadJson('resources/players.json');
        if (globalPlayers && Array.isArray(globalPlayers.players)){
          base = globalPlayers.players;
        }
      }
      try{
        if (window.db){ 
          if (!leagueId){
            state.players = base;
            return;
          }
          const playersCol = getLeagueCollection('players', leagueId);
          if (!playersCol) {
            state.players = base;
            return;
          }
          const snap = await playersCol.get().catch(err => {
            console.warn('[matchday] Errore caricamento players:', err);
            return { docs: [], empty: true };
          });
          const docs = snap.docs.map(d=> ({ player_id:d.id, ...(d.data()||{}) }));
          const map=new Map(base.map(p=>[p.player_id||p.nome_completo,p]));
          for (const x of docs){ const key=x.player_id||x.nome_completo; map.set(key, { ...(map.get(key)||{}), ...x }); }
          state.players = Array.from(map.values());
        } else {
          state.players = base;
        }
      }catch{
        state.players = base;
      }
    }
    async function boot(){
      state.leagueId = await ensureLeagueReady(10000);
      if (!state.leagueId) {
        notifyMissingLeague('calcolare la giornata');
        return;
      }

      // Applica etichette UI adattive in base al tipo di lega (sport vs reality_show)
      applyMatchdayUiStrings();

      const [rulesLoaderResult, coachesRes] = await Promise.all([
        (window.loadRulesJSON ? window.loadRulesJSON() : Promise.resolve({ rules: [] })),
        fetch('resources/coaches.json')
      ]);
      await loadPlayers();
      
      // Carica regole da Firestore (se disponibile) o da JSON
      const loaderRules = Array.isArray(rulesLoaderResult?.rules) ? rulesLoaderResult.rules : [];

      try {
        if (window.db) {
          const leagueId = state.leagueId || await getLeagueIdOrNotify('caricare le regole', { notify: false });
          let firestoreRules = [];

          if (leagueId) {
            const leagueSnap = await firestore().collection('leagues').doc(leagueId)
              .collection('rules')
              .where('attivo', '==', true)
              .get();
            firestoreRules = leagueSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          }

          if (!firestoreRules.length) {
            const globalSnap = await firestore().collection('rules')
              .where('attivo', '==', true)
              .get();
            firestoreRules = globalSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          }

          if (!firestoreRules.length) {
            firestoreRules = loaderRules;
          }

          state.rules = dedupeRules(firestoreRules);
        } else {
          state.rules = dedupeRules(loaderRules);
        }
      } catch (e) {
        console.warn('Errore caricamento regole da Firestore, uso JSON:', e);
        state.rules = dedupeRules(loaderRules);
      }
      
      state.coaches = (await coachesRes.json()).coaches||[];

      try {
        if (window.featureFlagsLoader && typeof window.featureFlagsLoader.loadFlags === 'function') {
          featureFlags = await window.featureFlagsLoader.loadFlags();
          
        }
      } catch (error) {
        console.warn('[matchday] Impossibile caricare i feature flags:', error);
      }

      await loadAdmin();
      await autoSelectActiveGiornata();
      await loadDay();
      bootSelect();
      renderTabs();
      renderSummary();
      document.getElementById('year').textContent = new Date().getFullYear();
      applyMobileMode();
    }
    
    boot();
    
    window.addEventListener('league-ready', () => {
      try { applyMatchdayUiStrings(); } catch (_) {}
    });
    
    window.addEventListener('league-changed', () => {
      // Il selettore leghe esegue già un reload; questo è un ulteriore safety net
      try {
        window.location.reload();
      } catch (_) {}
    });
  </script>

      setTimeout(()=>{ el.remove(); }, 2000);
    }
