<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Regole Duplicate</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js"></script>
  <style>
    body {
      font-family: system-ui;
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    h1 { color: #dc2626; }
    .btn {
      background: #2d6cdf;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-right: 10px;
    }
    .btn:hover { background: #1d4ed8; }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .success { background: #d4edda; color: #155724; }
    .warning { background: #fff3cd; color: #856404; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔍 Check Regole Duplicate</h1>
    <p>Verifica se ci sono regole duplicate nel database (stesso rule_id o descrizione identica)</p>
    <button class="btn" id="checkBtn">▶️ Verifica Duplicati</button>
    <button class="btn" onclick="location.href='admin-rules.html'" style="background:#28a745;">← Torna alle Regole</button>
  </div>

  <div id="results"></div>

  <script>
    const db = firebase.firestore();
    
    document.getElementById('checkBtn').addEventListener('click', async () => {
      const results = document.getElementById('results');
      results.innerHTML = '<div class="card result">⏳ Caricamento regole...</div>';
      
      try {
        const snap = await db.collection('rules').get();
        const rules = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        
        // Check duplicati rule_id
        const ruleIdMap = {};
        const duplicateIds = [];
        
        rules.forEach(r => {
          if (r.rule_id) {
            if (ruleIdMap[r.rule_id]) {
              ruleIdMap[r.rule_id].push(r);
            } else {
              ruleIdMap[r.rule_id] = [r];
            }
          }
        });
        
        Object.entries(ruleIdMap).forEach(([id, items]) => {
          if (items.length > 1) {
            duplicateIds.push({ rule_id: id, items });
          }
        });
        
        // Check descrizioni simili
        const descMap = {};
        const duplicateDescs = [];
        
        rules.forEach(r => {
          const desc = (r.nome_bonus || r.descrizione || '').toLowerCase().trim();
          if (desc) {
            if (descMap[desc]) {
              descMap[desc].push(r);
            } else {
              descMap[desc] = [r];
            }
          }
        });
        
        Object.entries(descMap).forEach(([desc, items]) => {
          if (items.length > 1) {
            duplicateDescs.push({ descrizione: desc, items });
          }
        });
        
        // Report
        let html = '';
        
        html += `<div class="card result ${duplicateIds.length === 0 && duplicateDescs.length === 0 ? 'success' : 'warning'}">`;
        html += `<strong>📊 REPORT</strong>\n\n`;
        html += `Regole totali: ${rules.length}\n`;
        html += `Duplicati rule_id: ${duplicateIds.length}\n`;
        html += `Duplicati descrizione: ${duplicateDescs.length}\n\n`;
        
        if (duplicateIds.length === 0 && duplicateDescs.length === 0) {
          html += '✅ Nessun duplicato trovato!\n';
        }
        html += `</div>`;
        
        if (duplicateIds.length > 0) {
          html += '<div class="card result warning">';
          html += '<strong>⚠️ DUPLICATI RULE_ID</strong>\n\n';
          duplicateIds.forEach(dup => {
            html += `Rule ID: ${dup.rule_id} (${dup.items.length}x)\n`;
            dup.items.forEach(item => {
              html += `  - ${item.nome_bonus || item.descrizione} (${item.valore}) [${item.id}]\n`;
            });
            html += '\n';
          });
          html += '</div>';
        }
        
        if (duplicateDescs.length > 0) {
          html += '<div class="card result warning">';
          html += '<strong>⚠️ DUPLICATI DESCRIZIONE</strong>\n\n';
          duplicateDescs.forEach(dup => {
            html += `Descrizione: "${dup.descrizione}" (${dup.items.length}x)\n`;
            dup.items.forEach(item => {
              html += `  - ${item.rule_id} (${item.valore}) [${item.id}]\n`;
            });
            html += '\n';
          });
          html += '</div>';
        }
        
        results.innerHTML = html;
        
      } catch (err) {
        results.innerHTML = `<div class="card result error">❌ Errore: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
