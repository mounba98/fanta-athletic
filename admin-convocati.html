<!DOCTYPE html>
<html lang="it">
<head>
  <script src="resources/theme-preload.js?v=20260925b"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Convocati</title>
  <link rel="stylesheet" href="resources/sheet.css?v=20261024" />
  <link rel="stylesheet" href="resources/tablet-support.css?v=20260920-final" />
  <link rel="stylesheet" href="resources/tablet-landscape.css?v=20260920-final" />
  <script src="resources/mobile-detect.js?v=20260920-final"></script>
  <style>
    body { padding-bottom: 150px; }
    .container { max-width: 900px; margin: 0 auto; padding: 16px; }
    .back { display:inline-block; margin-bottom:12px; color:var(--muted); text-decoration:none; font-weight:600; }
    .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
    .card h2 { font-size:18px; margin:0 0 4px; }
    .muted { color: var(--muted); font-size: 13px; line-height:1.5; }
    .top { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .top select { padding:10px 14px; border-radius:999px; border:1px solid rgba(148,163,184,.4); background:transparent; color:var(--text); font-family:inherit; font-size:15px; font-weight:600; }
    .top select option { color:#111; }
    .match { font-size:14px; font-weight:600; }
    .state { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; color:#fff; background:#64748b; }
    .state.on { background:#16a34a; } .state.dirty { background:#b45309; }
    .tools { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .chip { padding:7px 14px; border-radius:999px; border:1px solid rgba(148,163,184,.4) !important; background:transparent !important; color:var(--text) !important; font-weight:600; font-family:inherit; font-size:13px; cursor:pointer; }
    .role-h { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 8px; }
    .pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(136px,1fr)); gap:8px; }
    .pl { position:relative; display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:14px; border:1.5px solid rgba(148,163,184,.3) !important; background:transparent !important; box-shadow:none !important; color:var(--text) !important; font-family:inherit; font-size:13px; font-weight:600; text-align:left; cursor:pointer; opacity:.55; transition:opacity .15s, border-color .15s; }
    .pl img { width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0; }
    .pl .nm { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    /* spunta sull'angolo della foto, come il ruolo in panchina (il nome resta intero) */
    .pl .ck { display:none; position:absolute; left:30px; top:24px; width:17px; height:17px; border-radius:50%; background:#16a34a; box-shadow:0 0 0 1.5px var(--card, #fff); place-items:center; }
    .pl.on { opacity:1; border-color:#16a34a !important; background:rgba(22,163,74,.12) !important; }
    .pl.on .ck { display:grid; }
    .pl.on .ck::after { content:''; width:4px; height:8px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg) translate(-1px,-1px); }
    .bar { position:fixed; left:0; right:0; bottom:64px; z-index:50; padding:10px 16px; background:var(--card); box-shadow:0 -6px 20px rgba(0,0,0,.18); }
    .bar .in { max-width:900px; margin:0 auto; display:flex; gap:10px; align-items:center; }
    .bar .count { flex:1; font-size:14px; font-weight:600; }
    .sbtn { padding:11px 18px; border-radius:999px; font-weight:700; cursor:pointer; border:none !important; color:#fff !important; font-family:inherit; font-size:15px; }
    .sbtn.ok { background:#16a34a !important; } .sbtn.ghost { background:#64748b !important; } .sbtn:disabled { opacity:.45; cursor:not-allowed; }
    @media (min-width: 1024px) { .bar { bottom:0; } }
  </style>
  <!-- Icone app (D105): logo Athletic 2018 su fondo #0c1318 -->
  <link rel="icon" type="image/png" sizes="32x32" href="/resources/app-icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/resources/app-icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="/resources/app-icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <header>
    <a class="logo-home" href="index.html" aria-label="Home"><img src="resources/logo.png" alt="Fanta Athletic" /></a>
    <h1>Convocati</h1>
  </header>

  <main class="container">
    <a class="back" href="admin.html#live">← Pannello admin</a>
    <section class="card" id="denied" style="display:none;"><h2>Accesso riservato</h2><p>Solo per gli amministratori.</p></section>

    <div id="app" style="display:none;">
      <section class="card">
        <div class="top">
          <select id="gSel" aria-label="Giornata"></select>
          <span class="state" id="state">—</span>
        </div>
        <p class="match" id="match"></p>
        <p class="muted">Tocca i giocatori convocati e premi <strong>Pubblica</strong>: in Formazioni e Squadre tutti vedranno chi è convocato per questa giornata. Si può correggere quando serve.</p>
        <div class="tools">
          <button class="chip" id="all">Tutti</button>
          <button class="chip" id="none">Nessuno</button>
          <button class="chip" id="copyPrev">Come la giornata prima</button>
          <button class="chip" id="unpublish">Togli la lista</button>
        </div>
      </section>
      <section class="card" id="players"></section>
    </div>
  </main>

  <div class="bar" id="bar" style="display:none;">
    <div class="in">
      <span class="count" id="count">0 convocati</span>
      <button class="sbtn ok" id="save">Pubblica</button>
    </div>
  </div>

  <script src="resources/firebase-app-compat.js"></script>
  <script src="resources/firebase-auth-compat.js"></script>
  <script src="resources/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js?v=20260920-final"></script>
  <script src="resources/season.js?v=20261024b"></script>
  <script src="resources/convocati.js?v=20261025"></script>
  <script src="resources/toast.js?v=20260920-final"></script>
  <script>
    const $ = id => document.getElementById(id);
    const db = () => window.__LEGACY_DB__;
    const ROLE = ['Portiere', 'Difensore', 'Centrocampista', 'Attaccante'];
    const ROLE_H = { Portiere: 'Portieri', Difensore: 'Difensori', Centrocampista: 'Centrocampisti', Attaccante: 'Attaccanti' };
    const S = { user: null, lid: null, g: null, players: [], cal: [], all: {}, sel: new Set(), saved: null };

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function say(m) { if (typeof window.toast === 'function') window.toast(m); else alert(m); }
    // Nome breve come la panchina di Formazioni: soprannome, altrimenti "G. Cognome"
    function pname(p) {
      if (p.soprannome || p.nickname) return p.soprannome || p.nickname;
      const full = String(p.nome_completo || p.name || p.id).trim();
      if (p.nome && p.cognome) return p.nome.charAt(0) + '. ' + p.cognome;
      const parts = full.split(/\s+/);
      return parts.length > 1 ? parts[0].charAt(0) + '. ' + parts.slice(1).join(' ') : full;
    }
    const fullName = p => p.nome_completo || p.name || p.id;
    const same = (a, b) => a.size === b.size && [...a].every(x => b.has(x));

    function matchOf(g) {
      const n = parseInt(String(g).slice(1), 10);
      const m = S.cal.find(c => parseInt(c.giornata, 10) === n);
      if (!m) return '';
      const when = [m.date, m.time].filter(Boolean).join(' ');
      return [m.homeTeam, m.awayTeam].filter(Boolean).join(' – ') + (when ? ' · ' + when : '');
    }

    function render() {
      const groups = ROLE.map(r => ({ r, list: S.players.filter(p => p.role === r) })).filter(x => x.list.length);
      $('players').innerHTML = groups.map(x => '<div class="role-h">' + ROLE_H[x.r] + '</div><div class="pgrid">' +
        x.list.map(p => '<button class="pl' + (S.sel.has(p.id) ? ' on' : '') + '" data-id="' + esc(p.id) + '">' +
          '<img src="' + esc(p.image_url || 'resources/logo.png') + '" alt="" onerror="this.src=\'resources/logo.png\'" />' +
          '<span class="nm" title="' + esc(fullName(p)) + '">' + esc(pname(p)) + '</span><span class="ck"></span></button>').join('') + '</div>').join('');
      $('players').querySelectorAll('.pl').forEach(b => b.onclick = () => {
        const id = b.dataset.id;
        if (S.sel.has(id)) S.sel.delete(id); else S.sel.add(id);
        b.classList.toggle('on', S.sel.has(id));
        status();
      });
      status();
    }

    function status() {
      const n = S.sel.size, dirty = !S.saved ? n > 0 : !same(S.sel, S.saved.ids);
      $('count').textContent = n + (n === 1 ? ' convocato' : ' convocati');
      const st = $('state');
      if (dirty) { st.className = 'state dirty'; st.textContent = 'Da pubblicare'; }
      else if (S.saved) {
        st.className = 'state on';
        const d = S.saved.at ? new Date(S.saved.at) : null;
        st.textContent = 'Pubblicati' + (d ? ' il ' + d.toLocaleDateString('it-IT', { day: 'numeric', month: 'numeric' }) + ' alle ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) : '') + (S.saved.byName ? ' da ' + S.saved.byName : '');
      } else { st.className = 'state'; st.textContent = 'Non ancora pubblicati'; }
      $('save').disabled = !dirty || n === 0;
      $('unpublish').style.display = S.saved ? '' : 'none';
    }

    async function openG(g) {
      S.g = g;
      $('match').textContent = matchOf(g);
      S.all = await Convocati.loadAll(S.lid, true);
      S.saved = await Convocati.forGiornata(S.lid, g);
      S.sel = new Set(S.saved ? S.saved.ids : []);
      const prevN = parseInt(g.slice(1), 10) - 1;
      $('copyPrev').style.display = S.all['G' + prevN] ? '' : 'none';
      render();
    }

    $('all').onclick = () => { S.sel = new Set(S.players.map(p => p.id)); render(); };
    $('none').onclick = () => { S.sel = new Set(); render(); };
    $('copyPrev').onclick = () => {
      const prev = S.all['G' + (parseInt(S.g.slice(1), 10) - 1)];
      const ok = new Set(S.players.map(p => p.id));
      S.sel = new Set(((prev && prev.ids) || []).filter(id => ok.has(id)));
      render();
    };
    $('save').onclick = async () => {
      $('save').disabled = true;
      try {
        await Convocati.save(S.lid, S.g, S.sel, S.user);
        S.saved = await Convocati.forGiornata(S.lid, S.g, true);
        say('Convocati della ' + S.g + ' pubblicati');
      } catch (e) {
        console.error('[convocati] salvataggio', e);
        say('Errore nel salvataggio: ' + (e.code || e.message));
      }
      status();
    };
    $('unpublish').onclick = async () => {
      if (!confirm('Togliere la lista dei convocati della ' + S.g + '? In Formazioni non comparirà più.')) return;
      try { await Convocati.remove(S.lid, S.g); S.saved = null; S.sel = new Set(); render(); say('Lista tolta'); }
      catch (e) { say('Errore: ' + (e.code || e.message)); }
    };
    window.addEventListener('beforeunload', e => {
      const dirty = !S.saved ? S.sel.size > 0 : !same(S.sel, S.saved.ids);
      if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });

    async function init() {
      let r = 0; while ((!window.auth || !window.__LEGACY_DB__) && r++ < 50) await new Promise(x => setTimeout(x, 100));
      window.auth.onAuthStateChanged(async (user) => {
        if (!user) { location.href = 'auth.html?redirect=' + encodeURIComponent(location.href); return; }
        S.user = user;
        let ok = false;
        try { ok = (await db().collection('admins').doc(user.uid).get()).exists; } catch (e) {}
        if (!ok) { $('denied').style.display = 'block'; return; }
        const season = await Season.load();
        S.lid = season.leagueId;
        if (!S.lid) { $('denied').style.display = 'block'; $('denied').innerHTML = '<h2>Lega non trovata</h2>'; return; }
        const L = db().collection('leagues').doc(S.lid);
        const [ps, cal] = await Promise.all([L.collection('players').get(), db().collection('athletic_calendar').get()]);
        S.players = ps.docs.map(d => Object.assign({ id: d.id }, d.data()))
          .filter(p => !p.is_dead && !p.fuori_rosa)
          .sort((a, b) => ROLE.indexOf(a.role) - ROLE.indexOf(b.role) || String(pname(a)).localeCompare(String(pname(b))));
        S.cal = cal.docs.map(d => d.data());
        // giornate della stagione + quelle in più del Calendario Athletic (come la Partita live)
        const calMax = Math.max(0, ...S.cal.map(c => parseInt(c.giornata, 10)).filter(Number.isFinite));
        const n = Math.max(Number(season.numGiornate) || 38, calMax);
        let first = 'G1';
        for (let i = 1; i <= n; i++) { const d = await L.collection('days').doc('G' + i).get().catch(() => null); if (!d || !d.exists || d.data().computed !== true) { first = 'G' + i; break; } }
        const q = new URLSearchParams(location.search).get('g');
        $('gSel').innerHTML = Array.from({ length: n }, (_, i) => '<option value="G' + (i + 1) + '">Giornata ' + (i + 1) + '</option>').join('');
        $('gSel').value = q || first;
        $('gSel').onchange = () => openG($('gSel').value);
        $('app').style.display = 'block';
        $('bar').style.display = 'block';
        openG($('gSel').value);
      });
    }
    init();
  </script>
  <script src="resources/navbar.js?v=20261024b"></script>
  <script src="resources/app-fresh.js?v=20261004"></script>
  <script src="resources/mobile-menu.js?v=20261024b"></script>
  <script src="resources/edge-swipe-menu.js?v=20260925"></script>
  <script src="resources/bottom-nav.js?v=20261024b"></script>
  <script src="resources/theme.js?v=20260925b"></script>
</body>
</html>
