<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>WIRC Snap</title>
  <link rel="icon" href="/favicon.svg" />
  <script src="resources/firebase-app-compat.js"></script>
  <script src="resources/firebase-auth-compat.js"></script>
  <script src="resources/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js?v=20260920-final"></script>
  <link rel="stylesheet" href="wirc-snap-styles.css" />
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="app-container">
    <!-- AUTH -->
    <div class="auth-screen" id="authScreen">
      <div class="auth-logo">⚡ WIRC SNAP ⚡</div>
      <div class="auth-subtitle">Card Battle Game</div>
      <button class="auth-btn" id="loginBtn">🎮 Login Fanta Athletic</button>
      <div class="auth-user-info" id="userInfo" style="display:none;">
        <div class="auth-user-name" id="userName"></div>
        <div class="auth-user-email" id="userEmail"></div>
      </div>
    </div>

    <!-- GAME -->
    <div class="game-screen" id="gameScreen">
      <div class="game-header">
        <div class="header-left">
          <div class="turn-info">
            <div class="turn-label">Turn</div>
            <div class="turn-number" id="turnNumber">1</div>
          </div>
          <div class="energy-info">
            <div class="energy-label">Energy</div>
            <div class="energy-amount" id="energyAmount">1/1</div>
          </div>
          <div class="timer-info">
            <div class="timer-label">Timer</div>
            <div class="timer-bar">
              <div class="timer-fill" id="timerFill" style="width:100%"></div>
            </div>
          </div>
        </div>
        <div class="header-right">
          <button class="header-btn snap" id="snapBtn">⚡ Snap</button>
          <button class="header-btn retreat" id="retreatBtn">🏃 Retreat</button>
        </div>
      </div>

      <div class="cubes-badge" id="cubesBadge">
        <div class="cubes-label">Cubes</div>
        <div id="cubesAmount">1</div>
      </div>

      <div class="battle-field" id="battleField"></div>
      <div class="hand" id="hand"></div>
      
      <div class="turn-controls">
        <button class="turn-btn" id="endTurnBtn">🚀 End Turn</button>
      </div>
    </div>
  </div>

  <!-- Card/Location Detail Modal -->
  <div class="detail-modal" id="detailModal">
    <div class="detail-modal-content">
      <button class="detail-modal-close" id="detailModalClose">✕</button>
      <div id="detailModalBody"></div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div class="modal" id="gameOverModal">
    <div class="modal-content">
      <div class="modal-title" id="gameOverTitle">Victory!</div>
      <div class="modal-subtitle" id="gameOverSubtitle">You won!</div>
      <div class="modal-stats">
        <div class="modal-stat">
          <div class="modal-stat-label">Your Score</div>
          <div class="modal-stat-value player" id="playerFinalScore">0</div>
        </div>
        <div class="modal-stat">
          <div class="modal-stat-label">Opponent</div>
          <div class="modal-stat-value opponent" id="opponentFinalScore">0</div>
        </div>
      </div>
      <div class="modal-stats">
        <div class="modal-stat">
          <div class="modal-stat-label">Cubes</div>
          <div class="modal-stat-value" style="color:#fbbf24;" id="cubesWon">0</div>
        </div>
      </div>
      <button class="modal-btn" id="playAgainBtn">🎮 Play Again</button>
    </div>
  </div>

  <script src="wirc-snap-engine.js"></script>
  <script src="wirc-snap-ui.js"></script>
</body>
</html>
