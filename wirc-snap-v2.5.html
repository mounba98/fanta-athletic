<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>WIRC SNAP</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(180deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
      color: white;
      overflow: hidden;
    }

    .app-container {
      max-width: 500px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0f1419;
    }

    .section {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding-bottom: 70px;
    }
    .section.active { display: flex; flex-direction: column; }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      max-width: 500px;
      width: 100%;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      border-top: 2px solid #dc143c;
      display: flex;
      z-index: 1000;
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #64748b;
      transition: color 0.2s;
    }
    .nav-btn.active { color: #fbbf24; }
    .nav-btn:hover { color: #fbbf24; }
    .nav-icon { font-size: 24px; }
    .nav-label { font-size: 10px; font-weight: 700; text-transform: uppercase; }

    /* HOME */
    .home-header {
      background: linear-gradient(135deg, #dc143c 0%, #7f1d1d 100%);
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #fbbf24;
    }
    .logo {
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: glow 2s infinite;
    }
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px rgba(251,191,36,0.5); }
      50% { text-shadow: 0 0 40px rgba(251,191,36,0.8); }
    }
    .player-card {
      background: rgba(30,41,59,0.8);
      margin: 15px;
      padding: 20px;
      border-radius: 16px;
      border: 2px solid #475569;
    }
    .player-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }
    .avatar {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: 3px solid #fbbf24;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .player-info { flex: 1; }
    .player-name { font-size: 20px; font-weight: 700; color: #fbbf24; }
    .player-level { font-size: 14px; color: #94a3b8; margin-top: 4px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .stat-box {
      background: rgba(0,0,0,0.5);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #fbbf24;
    }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .xp-bar {
      background: rgba(0,0,0,0.5);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }
    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%);
      width: 30%;
      transition: width 0.3s;
    }
    .action-buttons {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #dc143c 0%, #991b1b 100%);
      color: white;
    }
    .btn-secondary {
      background: rgba(30,41,59,0.8);
      color: white;
      border: 2px solid #475569;
    }
    .btn:hover {
      transform: translateY(-2px);
    }

    /* GAME BOARD */
    .game-header {
      background: rgba(0,0,0,0.8);
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #dc143c;
    }
    .energy { background: #3b82f6; padding: 8px 16px; border-radius: 20px; font-weight: 700; }
    .turn { background: #fbbf24; padding: 8px 16px; border-radius: 20px; font-weight: 700; color: #000; }
    .battlefield {
      flex: 1;
      overflow-y: auto;
      padding: 15px 10px;
    }
    .location {
      margin-bottom: 20px;
      background: rgba(30,41,59,0.6);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #475569;
    }
    .location-header {
      background: linear-gradient(135deg, #dc143c 0%, #7f1d1d 100%);
      padding: 16px;
      text-align: center;
      position: relative;
    }
    .location-name { font-size: 16px; font-weight: 900; text-transform: uppercase; }
    .location-effect { font-size: 11px; opacity: 0.9; margin-top: 4px; font-style: italic; }
    .location-power {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.8);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      border: 2px solid #fbbf24;
    }
    .zone {
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      min-height: 100px;
    }
    .zone-opponent { background: rgba(239,68,68,0.1); border-bottom: 2px dashed #475569; }
    .zone-player { background: rgba(34,197,94,0.1); }
    .card {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #475569;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      min-height: 120px;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #fbbf24;
    }
    .card.selected {
      border-color: #22c55e;
      box-shadow: 0 0 20px rgba(34,197,94,0.6);
      transform: scale(1.05);
    }
    .card.revealed {
      animation: reveal 0.5s ease-out;
    }
    @keyframes reveal {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .location.selectable {
      cursor: pointer;
      animation: pulse-border 1s infinite;
    }
    @keyframes pulse-border {
      0%, 100% { border-color: #fbbf24; }
      50% { border-color: #f59e0b; box-shadow: 0 0 20px rgba(251,191,36,0.4); }
    }
    .card-cost {
      position: absolute;
      top: 4px;
      left: 4px;
      background: #3b82f6;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 12px;
      z-index: 2;
    }
    .card-power {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #dc143c;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 12px;
      z-index: 2;
    }
    .card-emoji {
      font-size: 40px;
      text-align: center;
      margin: 18px 0 8px;
    }
    .card-name {
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      color: #fbbf24;
      margin-bottom: 6px;
    }
    .card-effect {
      font-size: 9px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.3;
    }
    .score-bar {
      padding: 10px;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: space-between;
      font-weight: 900;
    }
    .score-opponent { color: #ef4444; }
    .score-player { color: #22c55e; }
    .hand {
      background: rgba(0,0,0,0.95);
      padding: 10px;
      border-top: 3px solid #dc143c;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      max-height: 180px;
      overflow-x: auto;
    }

    /* COLLEZIONE */
    .collection-header {
      background: rgba(30,41,59,0.8);
      padding: 15px;
      border-bottom: 2px solid #475569;
    }
    .collection-title {
      font-size: 24px;
      font-weight: 900;
      color: #fbbf24;
      text-align: center;
    }
    .collection-stats {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
      font-size: 14px;
      color: #94a3b8;
    }
    .collection-grid {
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .collection-card {
      background: rgba(30,41,59,0.8);
      border: 2px solid #475569;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 140px;
    }
    .collection-card:hover {
      transform: translateY(-3px);
      border-color: #fbbf24;
    }

    /* MODAL */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      backdrop-filter: blur(10px);
    }
    .modal.show { display: flex; }
    .modal-content {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 40px 30px;
      border-radius: 20px;
      max-width: 400px;
      border: 3px solid #dc143c;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    }
    .modal-title {
      font-size: 52px;
      margin-bottom: 15px;
      animation: bounce 1s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .modal-text {
      font-size: 24px;
      font-weight: 700;
      margin: 15px 0;
      color: #fbbf24;
    }
    .modal-stats {
      margin: 20px 0;
      font-size: 18px;
      color: #94a3b8;
    }
    .btn-modal {
      background: linear-gradient(135deg, #dc143c 0%, #991b1b 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 6px 20px rgba(220,20,60,0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-modal:hover {
      transform: scale(1.05);
    }

    /* DETAIL MODAL */
    .detail-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 4000;
      backdrop-filter: blur(10px);
    }
    .detail-modal.show { display: flex; }
    .detail-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 4px solid #fbbf24;
      border-radius: 20px;
      padding: 30px;
      max-width: 350px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    }
    .detail-emoji {
      font-size: 80px;
      text-align: center;
      margin: 20px 0;
    }
    .detail-name {
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      color: #fbbf24;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .detail-stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 20px 0;
    }
    .detail-stat {
      text-align: center;
    }
    .detail-stat-label {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .detail-stat-value {
      font-size: 36px;
      font-weight: 900;
      color: white;
    }
    .detail-effect {
      background: rgba(251,191,36,0.1);
      padding: 16px;
      border-radius: 12px;
      margin: 20px 0;
      border: 2px solid rgba(251,191,36,0.3);
    }
    .detail-effect-type {
      font-size: 14px;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .detail-effect-desc {
      font-size: 16px;
      line-height: 1.5;
      color: #e2e8f0;
    }
    .btn-close-detail {
      background: #64748b;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
    }
  </style>
  <!-- Icone app (D105): logo Athletic 2018 su fondo #0c1318 -->
  <link rel="icon" type="image/png" sizes="32x32" href="/resources/app-icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/resources/app-icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="/resources/app-icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <div class="app-container">
    <!-- HOME -->
    <section id="home" class="section active">
      <div class="home-header">
        <div class="logo">⚡ WIRC SNAP ⚡</div>
      </div>
      
      <div class="player-card">
        <div class="player-header">
          <div class="avatar">🧑</div>
          <div class="player-info">
            <div class="player-name" id="playerName">Player</div>
            <div class="player-level">Livello <span id="playerLevel">1</span></div>
          </div>
        </div>
        
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-value" id="playerXP">0</div>
            <div class="stat-label">XP</div>
          </div>
          <div class="stat-box">
            <div class="stat-value">💎 <span id="playerCredits">1000</span></div>
            <div class="stat-label">Crediti</div>
          </div>
          <div class="stat-box">
            <div class="stat-value">🪙 <span id="playerGold">50</span></div>
            <div class="stat-label">Oro</div>
          </div>
        </div>
        
        <div class="xp-bar">
          <div class="xp-fill" id="xpFill"></div>
        </div>
      </div>
      
      <div class="action-buttons">
        <button class="btn btn-primary" onclick="startGame()">🤖 vs AI</button>
        <button class="btn btn-primary" onclick="alert('Multiplayer in arrivo! 🚀')" style="background:linear-gradient(135deg,#8b5cf6 0%,#6366f1 100%)">👥 vs Amico</button>
        <button class="btn btn-secondary" onclick="showSection('collection')">🃏 Collezione</button>
        <button class="btn btn-secondary" onclick="toggleAuth()" id="btnAuth">🔐 Login</button>
      </div>
    </section>

    <!-- GAME -->
    <section id="game" class="section">
      <div class="game-header">
        <div class="energy">⚡ <span id="gameEnergy">1</span></div>
        <div class="turn">Turno <span id="gameTurn">1</span>/6</div>
        <button class="btn" style="padding:8px 16px;background:#22c55e" onclick="endTurn()">Fine Turno</button>
      </div>

      <div class="battlefield" id="battlefield"></div>

      <div class="hand" id="hand"></div>
    </section>

    <!-- COLLECTION -->
    <section id="collection" class="section">
      <div class="collection-header">
        <div class="collection-title">📚 Collezione</div>
        <div class="collection-stats">
          <div>Possedute: <span id="collectionOwned">42</span>/42</div>
          <div>Completamento: 100%</div>
        </div>
      </div>
      <div class="collection-grid" id="collectionGrid"></div>
    </section>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-section="home" onclick="showSection('home')">
        <div class="nav-icon">🏠</div>
        <div class="nav-label">Home</div>
      </button>
      <button class="nav-btn" data-section="collection" onclick="showSection('collection')">
        <div class="nav-icon">🃏</div>
        <div class="nav-label">Carte</div>
      </button>
      <button class="nav-btn" data-section="game" onclick="showSection('game')">
        <div class="nav-icon">⚔️</div>
        <div class="nav-label">Gioca</div>
      </button>
    </nav>
  </div>

  <!-- MODAL VITTORIA -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">🏆</div>
      <div class="modal-text" id="modalText">Vittoria!</div>
      <div class="modal-stats" id="modalStats"></div>
      <button class="btn-modal" onclick="closeModal()">🔄 Nuova Partita</button>
    </div>
  </div>

  <!-- DETAIL MODAL -->
  <div class="detail-modal" id="detailModal" onclick="closeDetail()">
    <div class="detail-card" onclick="event.stopPropagation()" id="detailCard"></div>
  </div>

  <script>
    // FIREBASE INIT
    if (!firebase.apps.length) {
      firebase.initializeApp({
        apiKey: "AIzaSyDlCT7mFOH3Vr7BVKhBf6YyKbh8Ty3fzAM",
        authDomain: "fanta-athletic.firebaseapp.com",
        projectId: "fanta-athletic",
        storageBucket: "fanta-athletic.firebasestorage.app",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
      });
    }
    window.auth = firebase.auth();
    window.db = firebase.firestore();

    // USER STATE
    let currentUser = null;
    window.auth.onAuthStateChanged((user) => {
      currentUser = user;
      if (user) {
        loadUserProfile(user.uid);
      } else {
        gameState.player.xp = 0;
        gameState.player.level = 1;
        gameState.player.credits = 1000;
        gameState.player.gold = 50;
        updateHomeUI();
      }
    });

    async function loadUserProfile(uid) {
      try {
        const doc = await window.db.collection('wirc_snap_users').doc(uid).get();
        if (doc.exists) {
          const data = doc.data();
          gameState.player.xp = data.xp || 0;
          gameState.player.level = data.level || 1;
          gameState.player.credits = data.credits || 1000;
          gameState.player.gold = data.gold || 50;
          gameState.player.collection = data.collection || [];
        } else {
          // Crea profilo nuovo
          await window.db.collection('wirc_snap_users').doc(uid).set({
            xp: 0,
            level: 1,
            credits: 1000,
            gold: 50,
            collection: [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
        updateHomeUI();
      } catch (e) {
        console.error('Load profile error:', e);
      }
    }

    function updateHomeUI() {
      document.getElementById('playerXP').textContent = gameState.player.xp;
      document.getElementById('playerLevel').textContent = gameState.player.level;
      document.getElementById('playerCredits').textContent = gameState.player.credits;
      document.getElementById('playerGold').textContent = gameState.player.gold;
      
      const xpNeeded = gameState.player.level * 100;
      const xpPercent = (gameState.player.xp % xpNeeded) / xpNeeded * 100;
      document.getElementById('xpFill').style.width = xpPercent + '%';
      
      const btnAuth = document.getElementById('btnAuth');
      if (currentUser) {
        document.getElementById('playerName').textContent = currentUser.displayName || currentUser.email || 'Player';
        if (btnAuth) btnAuth.textContent = '🚪 Logout';
      } else {
        document.getElementById('playerName').textContent = 'Ospite';
        if (btnAuth) btnAuth.textContent = '🔐 Login';
      }
    }

    // 42 CARTE DATABASE
    const CARDS = [
      {id:1,nome:"Fracks",costo:4,forza:6,emoji:"👔",effetto:{tipo:"Continuo",desc:"+1 Forza alle tue carte"}},
      {id:2,nome:"Tommy",costo:5,forza:8,emoji:"⚽",effetto:{tipo:"Continuo",desc:"-1 Forza carte nemiche"}},
      {id:3,nome:"Bosi",costo:2,forza:3,emoji:"🌿",effetto:{tipo:"Continuo",desc:"+1 Forza fine turno"}},
      {id:4,nome:"Dux",costo:2,forza:3,emoji:"😎",effetto:{tipo:"Scoperta",desc:"+2 Forza"}},
      {id:5,nome:"Chep",costo:3,forza:2,emoji:"🧠",effetto:{tipo:"Scoperta",desc:"Disattiva carta nemica"}},
      {id:6,nome:"Toti",costo:3,forza:4,emoji:"☕",effetto:{tipo:"Continuo",desc:"+1 Forza"}},
      {id:7,nome:"Paolino",costo:1,forza:1,emoji:"🔍",effetto:{tipo:"Scoperta",desc:"Pesca 1 carta"}},
      {id:8,nome:"Pippo",costo:2,forza:3,emoji:"🎉",effetto:{tipo:"Scoperta",desc:"+1 Forza"}},
      {id:9,nome:"Giulietto",costo:2,forza:2,emoji:"📊",effetto:{tipo:"Continuo",desc:"+1 Forza"}},
      {id:10,nome:"Wabione",costo:4,forza:7,emoji:"🧱",effetto:{tipo:"Continuo",desc:"+3 Forza"}},
      {id:11,nome:"Calosi",costo:3,forza:5,emoji:"🎨",effetto:{tipo:"Continuo",desc:"+2 Forza"}},
      {id:12,nome:"Giabba",costo:3,forza:4,emoji:"🎸",effetto:{tipo:"Continuo",desc:"+2 Forza"}},

      {id:35,nome:"Giulia",costo:2,forza:3,emoji:"💝",effetto:{tipo:"Continuo",desc:"+2 a Titti"}},
      {id:36,nome:"Serena",costo:3,forza:4,emoji:"📚",effetto:{tipo:"Scoperta",desc:"Pesca 2, scarta 1"}},
      {id:37,nome:"Matilde",costo:2,forza:3,emoji:"🏕️",effetto:{tipo:"Continuo",desc:"+1 Scout"}},
      {id:38,nome:"Martina",costo:2,forza:3,emoji:"🎨",effetto:{tipo:"Scoperta",desc:"+1 a fratelli"}},
      {id:39,nome:"Marta",costo:3,forza:5,emoji:"💍",effetto:{tipo:"Continuo",desc:"+3 a Tommy G"}},
      {id:40,nome:"Lisa",costo:2,forza:3,emoji:"🌸",effetto:{tipo:"Continuo",desc:"+2 a Ale"}},
      {id:41,nome:"Wonia",costo:3,forza:4,emoji:"🌹",effetto:{tipo:"Continuo",desc:"+2 a Wabione"}},
      {id:42,nome:"Purple",costo:3,forza:4,emoji:"💜",effetto:{tipo:"Scoperta",desc:"Cura +1 tutti"}}
    ];

    const LOCATIONS = [
      {nome:"Sala Carte",desc:"+2 Forza Scout/Cervellone"},
      {nome:"Bar",desc:"Festaioli +1 ogni turno"},
      {nome:"Veranda",desc:"Relaxati +3 turno 3"},
      {nome:"Chiringuito",desc:"Carte -1 costo"},
      {nome:"La 10",desc:"+2 Tecnologici"},
      {nome:"Angolo Rotture",desc:"Blocca Scoperta"},
      {nome:"Sala Grande",desc:"Forza 6+ → +3"},
      {nome:"Esterno",desc:"10% -2 Forza"},
      {nome:"Misericordia",desc:"Tutte -1"},
      {nome:"Doccia",desc:"+2 Allenatori/Atleti"},
      {nome:"Palestra",desc:"+2 Atleti/Trainer"},
      {nome:"Sala Musica",desc:"+2 Creativi"}
    ];

    // GAME STATE
    const gameState = {
      player: {
        xp: 0,
        level: 1,
        credits: 1000,
        gold: 50,
        deck: [],
        collection: []
      },
      game: {
        turn: 1,
        energy: 1,
        locations: [],
        playerField: [[],[],[]],
        opponentField: [[],[],[]],
        hand: [],
        deck: [],
        opponentHand: [],
        opponentDeck: [],
        selectedCardIndex: null
      }
    };

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function showSection(sectionId) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
      document.querySelector(`[data-section="${sectionId}"]`)?.classList.add('active');
      
      if (sectionId === 'collection') renderCollection();
    }

    function startGame() {
      showSection('game');
      initGame();
    }

    function toggleAuth() {
      if (currentUser) {
        window.auth.signOut();
        document.getElementById('btnAuth').textContent = '🔐 Login';
      } else {
        // Redirect to Fanta Athletic auth
        window.location.href = '/auth.html?redirect=' + encodeURIComponent(window.location.pathname);
      }
    }

    function renderCollection() {
      const grid = document.getElementById('collectionGrid');
      grid.innerHTML = CARDS.map(card => `
        <div class="collection-card">
          <div class="card-cost">${card.costo}</div>
          <div class="card-power">${card.forza}</div>
          <div class="card-emoji">${card.emoji}</div>
          <div class="card-name">${card.nome}</div>
          <div class="card-effect">${card.effetto.desc}</div>
        </div>
      `).join('');
    }

    function initGame() {
      // 3 location random
      gameState.game.locations = shuffle(LOCATIONS).slice(0, 3);
      
      // Deck separati: 12 carte random per player, 12 diverse per opponent
      const shuffled = shuffle(CARDS);
      gameState.game.deck = shuffled.slice(0, 12).map(c => ({...c}));
      gameState.game.opponentDeck = shuffled.slice(12, 24).map(c => ({...c}));
      
      // Pesca 3 carte iniziali (poi +1 al turno 1)
      gameState.game.hand = [];
      gameState.game.opponentHand = [];
      
      for (let i = 0; i < 3; i++) {
        if (gameState.game.deck.length > 0) {
          gameState.game.hand.push(gameState.game.deck.pop());
        }
        if (gameState.game.opponentDeck.length > 0) {
          gameState.game.opponentHand.push(gameState.game.opponentDeck.pop());
        }
      }
      
      gameState.game.turn = 1;
      gameState.game.energy = 1;
      gameState.game.playerField = [[],[],[]];
      gameState.game.opponentField = [[],[],[]];
      
      // Pesca 1 carta turno 1
      if (gameState.game.deck.length > 0) {
        gameState.game.hand.push(gameState.game.deck.pop());
      }
      if (gameState.game.opponentDeck.length > 0) {
        gameState.game.opponentHand.push(gameState.game.opponentDeck.pop());
      }
      
      renderGame();
    }

    function renderGame() {
      // Update header
      document.getElementById('gameEnergy').textContent = gameState.game.energy;
      document.getElementById('gameTurn').textContent = gameState.game.turn;
      
      // Render battlefield
      const bf = document.getElementById('battlefield');
      bf.innerHTML = gameState.game.locations.map((loc, i) => {
        const playerScore = calcLocationScore(gameState.game.playerField[i]);
        const opponentScore = calcLocationScore(gameState.game.opponentField[i]);
        const canPlay = gameState.game.selectedCardIndex !== null && gameState.game.playerField[i].length < 4;
        
        return `
          <div class="location ${canPlay ? 'selectable' : ''}" onclick="${canPlay ? `playCardAt(${i})` : ''}">
            <div class="location-header">
              <div class="location-name">${loc.nome}</div>
              <div class="location-effect">${loc.desc}</div>
              <div class="location-power">${i+1}</div>
            </div>
            <div class="zone zone-opponent">
              ${gameState.game.opponentField[i].map(c => renderCard(c)).join('') || '<div style="grid-column:1/-1;text-align:center;color:#64748b;padding:20px">Vuoto</div>'}
            </div>
            <div class="zone zone-player">
              ${gameState.game.playerField[i].map(c => renderCard(c)).join('') || '<div style="grid-column:1/-1;text-align:center;color:#64748b;padding:20px">Vuoto</div>'}
            </div>
            <div class="score-bar">
              <span class="score-opponent">${opponentScore}</span>
              <span class="score-player">${playerScore}</span>
            </div>
          </div>
        `;
      }).join('');
      
      // Render hand
      const hand = document.getElementById('hand');
      hand.innerHTML = gameState.game.hand.map((c, i) => {
        const selected = gameState.game.selectedCardIndex === i;
        return renderCard(c, i, selected);
      }).join('');
    }

    function calcLocationScore(cards) {
      return cards.reduce((sum, c) => sum + c.forza, 0);
    }

    function renderCard(card, handIndex, selected = false) {
      const cardData = JSON.stringify(card).replace(/"/g, '&quot;');
      return `
        <div class="card ${selected ? 'selected' : ''}" 
          ${handIndex !== undefined ? `onclick="selectCard(${handIndex})"` : ''}
          oncontextmenu="event.preventDefault(); showCardDetail(${cardData.replace(/&quot;/g, '\\\"')}); return false;">
          <div class="card-cost">${card.costo}</div>
          <div class="card-power">${card.forza}</div>
          <div class="card-emoji">${card.emoji}</div>
          <div class="card-name">${card.nome}</div>
          <div class="card-effect">${card.effetto.desc}</div>
        </div>
      `;
    }

    function selectCard(handIndex) {
      const card = gameState.game.hand[handIndex];
      if (!card) return;
      
      if (gameState.game.energy < card.costo) {
        alert('⚡ Energia insufficiente! Serve ' + card.costo + ' hai ' + gameState.game.energy);
        return;
      }
      
      // Toggle selection
      if (gameState.game.selectedCardIndex === handIndex) {
        gameState.game.selectedCardIndex = null;
      } else {
        gameState.game.selectedCardIndex = handIndex;
      }
      
      renderGame();
    }

    function playCardAt(locationIndex) {
      if (gameState.game.selectedCardIndex === null) return;
      
      const card = gameState.game.hand[gameState.game.selectedCardIndex];
      if (!card) return;
      
      if (gameState.game.playerField[locationIndex].length >= 4) {
        alert('❌ Location piena! Max 4 carte per campo.');
        return;
      }
      
      // Play card
      gameState.game.energy -= card.costo;
      gameState.game.playerField[locationIndex].push(card);
      gameState.game.hand.splice(gameState.game.selectedCardIndex, 1);
      gameState.game.selectedCardIndex = null;
      
      renderGame();
    }

    function endTurn() {
      if (gameState.game.turn >= 6) {
        // Fine partita, calcola vincitore
        checkWinner();
        return;
      }
      
      // AI turn (simple)
      opponentTurn();
      
      gameState.game.turn++;
      gameState.game.energy = Math.min(6, gameState.game.turn);
      
      // Draw card for player
      if (gameState.game.deck.length > 0) {
        gameState.game.hand.push(gameState.game.deck.pop());
      }
      
      // Draw card for opponent
      if (gameState.game.opponentDeck.length > 0) {
        gameState.game.opponentHand.push(gameState.game.opponentDeck.pop());
      }
      
      renderGame();
    }

    function opponentTurn() {
      // AI plays random cards from opponent hand
      const affordable = gameState.game.opponentHand.filter(c => c.costo <= gameState.game.energy);
      
      while (affordable.length > 0 && gameState.game.energy > 0) {
        const card = affordable[Math.floor(Math.random() * affordable.length)];
        const locIdx = Math.floor(Math.random() * 3);
        
        if (gameState.game.opponentField[locIdx].length < 4 && gameState.game.energy >= card.costo) {
          gameState.game.energy -= card.costo;
          gameState.game.opponentField[locIdx].push(card);
          gameState.game.opponentHand.splice(gameState.game.opponentHand.indexOf(card), 1);
          affordable.splice(affordable.indexOf(card), 1);
        } else {
          break;
        }
      }
      
      // Reset energia per player
      gameState.game.energy = Math.min(6, gameState.game.turn);
    }

    function checkWinner() {
      let playerWins = 0;
      let opponentWins = 0;
      let playerTotalScore = 0;
      let opponentTotalScore = 0;
      
      for (let i = 0; i < 3; i++) {
        const pScore = calcLocationScore(gameState.game.playerField[i]);
        const oScore = calcLocationScore(gameState.game.opponentField[i]);
        playerTotalScore += pScore;
        opponentTotalScore += oScore;
        
        if (pScore > oScore) playerWins++;
        else if (oScore > pScore) opponentWins++;
      }
      
      const modal = document.getElementById('modal');
      const title = document.getElementById('modalTitle');
      const text = document.getElementById('modalText');
      const stats = document.getElementById('modalStats');
      
      if (playerWins > opponentWins) {
        title.textContent = '🏆';
        text.textContent = 'VITTORIA!';
      } else if (opponentWins > playerWins) {
        title.textContent = '💀';
        text.textContent = 'SCONFITTA';
      } else {
        // Pareggio location, va a differenza punti
        if (playerTotalScore > opponentTotalScore) {
          title.textContent = '🏆';
          text.textContent = 'VITTORIA!';
        } else if (opponentTotalScore > playerTotalScore) {
          title.textContent = '💀';
          text.textContent = 'SCONFITTA';
        } else {
          title.textContent = '🤝';
          text.textContent = 'PAREGGIO';
        }
      }
      
      stats.innerHTML = `
        <div style="margin:10px 0">Location vinte:</div>
        <div style="font-size:28px;font-weight:900;margin:10px 0">
          <span style="color:#22c55e">${playerWins}</span> - <span style="color:#ef4444">${opponentWins}</span>
        </div>
        <div style="margin:10px 0">Punti totali:</div>
        <div style="font-size:24px;font-weight:700">
          <span style="color:#22c55e">${playerTotalScore}</span> - <span style="color:#ef4444">${opponentTotalScore}</span>
        </div>
      `;
      
      modal.classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
      showSection('home');
    }

    function showCardDetail(card) {
      const modal = document.getElementById('detailModal');
      const content = document.getElementById('detailCard');
      
      content.innerHTML = `
        <div class="detail-emoji">${card.emoji}</div>
        <div class="detail-name">${card.nome}</div>
        <div class="detail-stats">
          <div class="detail-stat">
            <div class="detail-stat-label">Costo</div>
            <div class="detail-stat-value" style="color:#3b82f6">${card.costo}</div>
          </div>
          <div class="detail-stat">
            <div class="detail-stat-label">Forza</div>
            <div class="detail-stat-value" style="color:#dc143c">${card.forza}</div>
          </div>
        </div>
        <div class="detail-effect">
          <div class="detail-effect-type">${card.effetto.tipo}</div>
          <div class="detail-effect-desc">${card.effetto.desc}</div>
        </div>
        <button class="btn-close-detail" onclick="closeDetail()">Chiudi</button>
      `;
      
      modal.classList.add('show');
    }

    function closeDetail() {
      document.getElementById('detailModal').classList.remove('show');
    }
    
    console.log('✅ WIRC SNAP v2 ready!', CARDS.length, 'carte,', LOCATIONS.length, 'location');
  </script>
