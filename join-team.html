<!DOCTYPE html>
<html lang="it">
<head>
  <script src="resources/theme-preload.js?v=20260925b"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unisciti alla Squadra</title>
  <link rel="stylesheet" href="resources/sheet.css?v=20260921-header" />
  <link rel="stylesheet" href="resources/tablet-support.css?v=20260920-final" />
  <link rel="stylesheet" href="resources/tablet-landscape.css?v=20260920-final" />
  <script src="resources/mobile-detect.js?v=20260920-final"></script>
  <style>
    .join-container { 
      max-width: 600px; 
      margin: 80px auto; 
      padding: 40px; 
      background: var(--card); 
      border-radius: 16px; 
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      text-align: center;
    }
    .join-icon { font-size: 80px; margin-bottom: 20px; }
    .code-input { 
      width: 100%; 
      padding: 16px; 
      font-size: 20px; 
      text-align: center; 
      text-transform: uppercase; 
      letter-spacing: 4px;
      border: 2px solid var(--primary);
      border-radius: 8px;
      margin: 20px 0;
    }
    .join-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .join-btn:hover { opacity: 0.9; }
  </style>
  <!-- Icone app (D105): logo Athletic 2018 su fondo #0c1318 -->
  <link rel="icon" type="image/png" sizes="32x32" href="/resources/app-icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/resources/app-icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="/resources/app-icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <header>
    <a class="logo-home" href="index.html" aria-label="Home">
      <img src="resources/logo.png" alt="Fanta Athletic" />
    </a>
    <h1>Unisciti alla Squadra</h1>
  </header>
  <div class="join-container">
    <div class="join-icon">👥</div>
    <h1>Unisciti alla Squadra</h1>
    <p>Inserisci il codice invito che hai ricevuto</p>
    
    <input type="text" id="codeInput" class="code-input" placeholder="T-XXXXXX" maxlength="8">
    
    <button class="join-btn" onclick="joinTeam()">Unisciti</button>
    
    <div id="result" style="margin-top: 20px;"></div>
  </div>

  <script src="resources/navbar.js?v=20260925"></script>
  <script src="resources/firebase-app-compat.js"></script>
  <script src="resources/firebase-auth-compat.js"></script>
  <script src="resources/firebase-firestore-compat.js"></script>
  <script src="resources/firebase-config.js?v=20260920-final"></script>
  <script>
    // Init Firebase SUBITO
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
  </script>
  <script>
    if (!firebase.apps.length) firebase.initializeApp(window.firebaseConfig);
    const db = firebase.firestore();
  </script>
  <script src="resources/team-invite-system.js"></script>
  <script>
    // Check URL params
    const urlParams = new URLSearchParams(window.location.search);
    const codeFromURL = urlParams.get('code');
    const leagueIdFromURL = urlParams.get('leagueId');
    
    if (codeFromURL) {
      document.getElementById('codeInput').value = codeFromURL;
    }
    
    async function joinTeam() {
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      const resultDiv = document.getElementById('result');
      
      if (!code) {
        resultDiv.innerHTML = '<div style="color: #f44336;">❌ Inserisci un codice</div>';
        return;
      }
      
      // Check if logged in
      const user = firebase.auth().currentUser;
      if (!user) {
        // Redirect to auth with return URL
        localStorage.setItem('join_team_code', code);
        if (leagueIdFromURL) {
          localStorage.setItem('join_team_league', leagueIdFromURL);
        }
        location.href = 'auth.html?return=join-team';
        return;
      }
      
      resultDiv.innerHTML = '<div>⏳ Verifica in corso...</div>';
      
      const storedLeagueHint = localStorage.getItem('join_team_league');
      const leagueHint = leagueIdFromURL || storedLeagueHint || null;
      const result = await TeamInviteSystem.useTeamInvite(code, user.uid, leagueHint);
      
      if (result.success) {
        resultDiv.innerHTML = `
          <div style="background: #e8f5e9; padding: 20px; border-radius: 8px; margin-top: 20px;">
            <h3 style="color: #4caf50; margin-top: 0;">Benvenuto nella Squadra!</h3>
            <p>Ti sei unito con successo come <strong>${result.role === 'head' ? 'Allenatore' : 'Vice-Allenatore'}</strong></p>
            <p>Redirect in 3 secondi...</p>
          </div>
        `;
        
        // Save league ID and redirect
        localStorage.setItem('last_league_id', result.leagueId);
        localStorage.removeItem('join_team_code');
        localStorage.removeItem('join_team_league');
        setTimeout(() => {
          location.href = 'index.html';
        }, 3000);
      } else {
        resultDiv.innerHTML = `
          <div style="background: #ffebee; padding: 20px; border-radius: 8px; margin-top: 20px; color: #f44336;">
            <strong>❌ Errore:</strong> ${result.error}
          </div>
        `;
      }
    }
    
    // Check if returning from auth
    firebase.auth().onAuthStateChanged(user => {
      if (user) {
        const savedCode = localStorage.getItem('join_team_code');
        const savedLeague = localStorage.getItem('join_team_league');
        if (savedCode) {
          localStorage.removeItem('join_team_code');
          if (savedLeague && !leagueIdFromURL) {
            // Mantieni league salvata finché non completiamo il join
            localStorage.setItem('join_team_league', savedLeague);
          }
          document.getElementById('codeInput').value = savedCode;
          joinTeam();
        }
      }
    });
  </script>
  <script src="resources/mobile-menu.js?v=20260925b"></script>
  <script src="resources/edge-swipe-menu.js?v=20260923-final"></script>
  <script src="resources/bottom-nav.js?v=20260920-final"></script>
  <script src="resources/theme.js?v=20260925b"></script>
</body>
</html>
