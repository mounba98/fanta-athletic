<!DOCTYPE html>
<html lang="it">
<head>
  <script src="resources/theme-preload.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin • Roster Giocatori</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="resources/sheet.css?v=202510172227" />
  <style>
    .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 20px; }
    .table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .table th, .table td { border-bottom: 1px solid rgba(0,0,0,0.08); padding: 10px; text-align: left; }
    .table th { background: var(--primary); color: white; font-weight: 700; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .input { padding: 10px 12px; border:1px solid #dbe1e8; border-radius: 10px; font-size: 14px; flex:1; }
    .btn { padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .btn-edit { background: #3498db; color: white; }
    .btn-delete { background: #e74c3c; color: white; }
  </style>
</head>
<body>
  <header>
    <a class="logo-home" href="index.html" aria-label="Home">
      <img src="resources/logo.png" alt="Fanta Athletic" />
    </a>
    <h1>Admin • Roster Giocatori</h1>
  </header>

  <main class="container">
    <!-- Add Player -->
    <section class="card">
      <h2>Aggiungi Giocatore</h2>
      <div class="row">
        <input id="pNome" class="input" placeholder="Nome" style="flex:1;" />
        <input id="pCognome" class="input" placeholder="Cognome" style="flex:1;" />
        <select id="pRuolo" class="input" style="flex:1;">
          <option value="">-- Ruolo --</option>
          <option>Portiere</option>
          <option>Difensore</option>
          <option>Centrocampista</option>
          <option>Attaccante</option>
        </select>
        <input id="pSoprannome" class="input" placeholder="Soprannome (opzionale)" style="flex:1;" />
        <button class="btn" onclick="addPlayer()" style="white-space:nowrap;">? Aggiungi</button>
      </div>
    </section>

    <!-- Players List -->
    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h2 style="margin:0;">Giocatori (<span id="playerCount">0</span>)</h2>
        <input id="searchInput" class="input" placeholder="?? Cerca..." style="max-width:300px;" oninput="filterPlayers()" />
      </div>
      <table class="table" id="playersTable">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Ruolo</th>
            <th>Soprannome</th>
            <th>Azioni</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <!-- Edit Modal -->
  <div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:var(--card);padding:24px;border-radius:12px;max-width:500px;width:90%;">
      <h3>Modifica Giocatore</h3>
      <div style="display:flex;flex-direction:column;gap:12px;margin:16px 0;">
        <input id="editNome" class="input" placeholder="Nome" />
        <input id="editCognome" class="input" placeholder="Cognome" />
        <select id="editRuolo" class="input">
          <option>Portiere</option>
          <option>Difensore</option>
          <option>Centrocampista</option>
          <option>Attaccante</option>
        </select>
        <input id="editSoprannome" class="input" placeholder="Soprannome" />
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn btn-secondary" onclick="closeEditModal()">Annulla</button>
        <button class="btn" onclick="saveEdit()">?? Salva</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="resources/firebase-config.js?v=20251021-3"></script>
  <script src="resources/app-check-config.js?v=20251021-3"></script>
  <script>
    // Init Firebase SUBITO
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
    
    // Attiva App Check (dev: debug token, prod: reCAPTCHA v3)
    activateAppCheck();
  </script>
  <script>
    if (!firebase.apps.length) {
      firebase.initializeApp(window.firebaseConfig);
    }
    const db = firebase.firestore();
  </script>
  <script src="resources/app-init.js"></script>
  <script src="resources/player-photos.js"></script>
  <script>

    firebase.auth().onAuthStateChanged(async (user)=>{
      if (!user) return location.href='auth.html';
      const a = await db.collection('admins').doc(user.uid).get();
      if (!a.exists) return location.href='index.html';
      boot();
    });

    let playersData = [];
    let currentEditId = null;

    function boot(){
      db.collection('players').onSnapshot(s=>{
        playersData = s.docs.map(d=>({id:d.id, ...d.data()}));
        console.log('Players loaded:', playersData.length, playersData);
        if (playersData.length > 0) {
          console.log('First player:', playersData[0]);
        }
        renderPlayers();
      });
    }

    async function addPlayer(){
      const nome = document.getElementById('pNome').value.trim();
      const cognome = document.getElementById('pCognome').value.trim();
      const ruolo = document.getElementById('pRuolo').value;
      const soprannome = document.getElementById('pSoprannome').value.trim();
      
      if (!nome || !cognome || !ruolo) return alert('Nome, cognome e ruolo obbligatori');
      
      await db.collection('players').add({
        name: `${nome} ${cognome}`,
        nome,
        cognome,
        role: ruolo,
        soprannome: soprannome || '',
        createdAt: Date.now()
      });
      
      document.getElementById('pNome').value = '';
      document.getElementById('pCognome').value = '';
      document.getElementById('pRuolo').value = '';
      document.getElementById('pSoprannome').value = '';
    }

    function renderPlayers(){
      const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
      const filtered = playersData.filter(p=> 
        !search || 
        p.name?.toLowerCase().includes(search) ||
        p.nome?.toLowerCase().includes(search) ||
        p.cognome?.toLowerCase().includes(search) ||
        p.soprannome?.toLowerCase().includes(search) ||
        p.role?.toLowerCase().includes(search)
      );
      
      document.getElementById('playerCount').textContent = filtered.length;
      
      const tbody = document.querySelector('#playersTable tbody');
      
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--muted);">
          ${playersData.length === 0 ? '?? Nessun giocatore in database. Aggiungine uno sopra!' : '?? Nessun risultato per la ricerca'}
        </td></tr>`;
        return;
      }
      
      tbody.innerHTML = filtered.map(p=>`
        <tr>
          <td>${p.nome || ''}</td>
          <td>${p.cognome || ''}</td>
          <td>${p.role || ''}</td>
          <td>${p.soprannome || '—'}</td>
          <td>
            <button class="btn btn-sm btn-edit" onclick="openEditModal('${p.id}')">?? Modifica</button>
            <button class="btn btn-sm btn-delete" onclick="deletePlayer('${p.id}')">??? Elimina</button>
          </td>
        </tr>
      `).join('');
    }

    function filterPlayers(){
      renderPlayers();
    }

    function openEditModal(id){
      const player = playersData.find(p=> p.id === id);
      if (!player) return;
      
      currentEditId = id;
      document.getElementById('editNome').value = player.nome || '';
      document.getElementById('editCognome').value = player.cognome || '';
      document.getElementById('editRuolo').value = player.role || '';
      document.getElementById('editSoprannome').value = player.soprannome || '';
      
      document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal(){
      document.getElementById('editModal').style.display = 'none';
      currentEditId = null;
    }

    async function saveEdit(){
      if (!currentEditId) return;
      
      const nome = document.getElementById('editNome').value.trim();
      const cognome = document.getElementById('editCognome').value.trim();
      const ruolo = document.getElementById('editRuolo').value;
      const soprannome = document.getElementById('editSoprannome').value.trim();
      
      if (!nome || !cognome || !ruolo) return alert('Nome, cognome e ruolo obbligatori');
      
      await db.collection('players').doc(currentEditId).update({
        name: `${nome} ${cognome}`,
        nome,
        cognome,
        role: ruolo,
        soprannome
      });
      
      closeEditModal();
    }

    async function deletePlayer(id){
      const player = playersData.find(p=> p.id === id);
      if (!confirm(`Eliminare ${player.name}?`)) return;
      await db.collection('players').doc(id).delete();
    }
  </script>
  <script src="resources/mobile-detect.js?v=2025101801"></script>
  <script src="resources/bottom-nav.js?v=2025101802"></script>
    <script src="resources/navbar-autohide.js?v=2025101805"></script>
  <script src="resources/theme.js?v=202510172227"></script>
  <script src="resources/navbar.js?v=2025110701"></script>
  <script src="resources/navbar-profile-icon.js?v=2025102001"></script>
  <script src="resources/notifications-dropdown.js?v=2025102002"></script>
</body>
</html>
